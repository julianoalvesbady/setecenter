<!DOCTYPE html>
<!--
  tela-bi.html — REFERÊNCIA DE DESIGN do BI de supermercado (fonte de verdade visual e de comportamento).

  ► Para o agente de desenvolvimento:
    1. Este arquivo NÃO é o produto e NÃO é um mockup a ser copiado. Ele define FORMA (tokens, layout,
       componentes, comportamento). O CONTEÚDO (números, nomes, listas) vem SEMPRE do backend.
    2. Todo dado exibido aqui sai de `api.get()` (seção "CAMADA DE DADOS" no script), que simula o backend
       com latência, vazio e erro. No produto, troque `api.get()` por chamadas reais — a UI não muda.
    3. Regras escritas: design/DESIGN_SYSTEM.md · tokens: design/design-tokens.md · instruções: CLAUDE.md.
    4. Em caso de divergência entre documento e esta tela, vale esta tela.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI Supermercado — Referência de design</title>
<script>
// Tema: segue o sistema operacional; a escolha manual (botão da topbar ou Configurações) prevalece e fica salva.
try{const t=localStorage.getItem('bi-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
/* =========================================================================
   1. TOKENS — únicos valores de cor, raio, sombra e fonte permitidos (DESIGN_SYSTEM §2)
   ========================================================================= */
:root{
  color-scheme:light;
  --bg:#FCFCFC; --surface:#FFFFFF; --hover:#F0F0F0; --border:#E6E6E6;
  --text:#171717; --muted:#6B6B6B;
  --brand:#3ECF8E; --brand-text:#0E7C4E; --focus:#0E7C4E;
  --action:#0F6B45; --on-action:#FFFFFF; --on-accent:#171717;
  --warning:#D97706; --warning-text:#B45309;
  --error:#DC2626; --danger-bg:#DC2626;
  --info:#0B8CFF; --magenta:#D6409F; --gray-series:#C9C9C9;
  --series-5:#8B5CF6; --series-6:#0891B2; --series-7:#8D6E63;
  --overlay:rgba(255,255,255,.55);
  --shadow:0 4px 14px rgba(0,0,0,.18);

  /* Séries de dados: ordem fixa (DESIGN_SYSTEM §6) */
  --series-1:var(--brand); --series-2:var(--info); --series-3:var(--gray-series); --series-4:var(--magenta);
  --series-other:var(--muted);

  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"Source Code Pro",Menlo,monospace;
  --r-chart:4px; --r-control:6px; --r-surface:8px; --r-pill:999px;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#171717; --surface:#1C1C1C; --hover:#262626; --border:#2E2E2E;
  --text:#EDEDED; --muted:#8F8F8F; --brand-text:#3ECF8E; --focus:#3ECF8E;
  --warning:#F59E0B; --warning-text:#F59E0B; --error:#E5484D;
  --gray-series:#4A4A4A; --series-5:#A78BFA; --series-6:#06B6D4; --series-7:#A1887F;
  --overlay:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171717; --surface:#1C1C1C; --hover:#262626; --border:#2E2E2E;
  --text:#EDEDED; --muted:#8F8F8F; --brand-text:#3ECF8E; --focus:#3ECF8E;
  --warning:#F59E0B; --warning-text:#F59E0B; --error:#E5484D;
  --gray-series:#4A4A4A; --series-5:#A78BFA; --series-6:#06B6D4; --series-7:#A1887F;
  --overlay:rgba(0,0,0,.6);
}

/* =========================================================================
   2. BASE
   ========================================================================= */
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mono{font:11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mu{color:var(--muted)}
.sm{font-size:12px}
.spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.good{color:var(--brand-text)} .bad{color:var(--error)}
hr.div{border:0;border-top:1px solid var(--border);margin:0}
[disabled],.is-disabled{opacity:.5;cursor:not-allowed!important;pointer-events:none}

/* =========================================================================
   3. ESTRUTURA — topbar 48 · sidebar 48/202 (sobrepõe) · menu secundário 257 · conteúdo
   ========================================================================= */
.topbar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);z-index:30}
.logo{display:grid;place-items:center;color:var(--brand)}
.crumb{display:flex;align-items:center;gap:10px;font-weight:500;white-space:nowrap;min-width:0}
.crumb .sep{color:var(--border)}
.topbar .feedback{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px;border-radius:var(--r-control)}
.topbar .feedback:hover{color:var(--text)}
.search{position:relative;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-pill);color:var(--muted);width:210px;font-size:13px;transition:border-color .12s}
.search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search kbd{font:11px var(--font-mono);color:var(--muted)}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;position:relative;transition:background .12s}
.ib:hover{background:var(--hover)}
.ib.avatar{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500;font-size:13px}
.ib.avatar:hover{background:var(--text)}
.dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--error)}

.sidebar{position:fixed;top:48px;bottom:0;left:0;width:48px;background:var(--bg);border-right:1px solid var(--border);z-index:20;overflow:hidden;padding:8px 0;transition:width .2s var(--ease) .15s}
.sidebar:hover,.sidebar:focus-within{width:202px;transition-delay:.08s}
.sidebar hr{border:0;border-top:1px solid var(--border);margin:8px 0}
.sidebar a{display:flex;align-items:center;height:32px;margin:2px 4px;border-radius:var(--r-control);color:var(--muted);white-space:nowrap;position:relative;transition:background .12s,color .12s}
.sidebar a:hover,.sidebar a.on{background:var(--hover);color:var(--text)}
.sidebar a:focus-visible{outline-offset:-2px}
.sidebar .i{width:40px;display:grid;place-items:center;flex:none;position:relative}
.sidebar .t{opacity:0;transition:opacity .12s ease-out;padding-right:8px;font-size:14px}
.sidebar:hover .t,.sidebar:focus-within .t{opacity:1;transition:opacity .15s ease-out .09s}
.sidebar .dot{top:-4px;right:9px}

.subnav{position:fixed;top:48px;bottom:0;left:48px;width:257px;background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px 24px;z-index:10}
.subnav .title{font-size:15px;font-weight:500;padding:4px 8px 4px}
.subnav .mono{display:block;padding:16px 8px 6px}
.subnav a{display:flex;align-items:center;height:32px;padding:0 8px;border-radius:var(--r-control);color:var(--muted);font-size:13px;transition:background .12s,color .12s}
.subnav a:hover,.subnav a.on{background:var(--hover);color:var(--text)}

main{margin-left:48px;padding:88px 40px 64px}
body.has-subnav main{margin-left:305px}
.wrap{max-width:1280px}

/* Cabeçalho de página e seções */
.ph{display:flex;align-items:flex-end;gap:8px;margin-bottom:32px}
.ph.tight{margin-bottom:16px}
h1{margin:0 0 4px;font-size:24px;font-weight:500;line-height:1.25;display:flex;gap:10px;align-items:center}
h2{margin:40px 0 16px;font-size:18px;font-weight:500;line-height:1.3}
h3{margin:24px 0 8px;font-size:14px;font-weight:500}
.lead{color:var(--muted);font-size:14px;max-width:720px}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cg{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.span2{grid-column:span 2}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* =========================================================================
   4. COMPONENTES BÁSICOS
   ========================================================================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-surface);min-width:0}
.pad{padding:16px 20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:var(--r-control);font-size:13px;line-height:1;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,filter .12s}
.btn:hover{background:var(--hover)}
.btn.pill{border-radius:var(--r-pill)}
.btn.pri{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.dan{background:var(--danger-bg);border-color:var(--danger-bg);color:#FFFFFF}
.btn.dan:hover{filter:brightness(1.1)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn .chev{color:var(--muted);margin-right:-2px}
.btn.pri .chev{color:inherit}
.link{background:none;border:0;padding:0 2px;color:var(--muted);font-size:13px;cursor:pointer;border-radius:4px}
.link:hover{color:var(--text)}

.badge{display:inline-flex;align-items:center;gap:4px;font:10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 7px;color:var(--muted);white-space:nowrap;font-weight:400}
.badge.wn{color:var(--warning-text);border-color:var(--warning)}
.badge.er{color:var(--error);border-color:var(--error)}
.badge.ok{color:var(--brand-text);border-color:var(--brand)}

.q{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid var(--muted);border-radius:50%;font:9px/1 var(--font-mono);color:var(--muted);cursor:help;flex:none;background:none;padding:0}

/* Input de toolbar (28) e campo de formulário (32) */
.input{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-control);color:var(--muted);background:transparent;min-width:0}
.input:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.input input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px;color:var(--text)}
.input input::placeholder,.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.fgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-width:420px}
.fgroup>label,.fgroup>.flabel{font-size:13px;font-weight:500}
.fgroup .help{font-size:12px;color:var(--muted)}
.fgroup .err{font-size:12px;color:var(--error)}
.field{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-control);background:transparent;font-size:13px;width:100%;outline:0}
textarea.field{height:auto;min-height:80px;padding:8px 10px;resize:vertical;line-height:1.45}
.field:focus-visible,.field:focus{outline:2px solid var(--focus);outline-offset:1px}
.field.invalid{border-color:var(--error)}
.select{justify-content:space-between;width:100%;max-width:420px;height:32px}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:14px;height:14px;margin:0;cursor:pointer}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:28px!important;height:16px!important;border-radius:var(--r-pill);background:var(--hover);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .12s,border-color .12s;flex:none}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--border);transition:transform .12s}
.switch:checked{background:var(--brand);border-color:var(--brand)}
.switch:checked::after{transform:translateX(12px);box-shadow:none}

.segmented{display:inline-flex;align-self:flex-start;border:1px solid var(--border);border-radius:var(--r-control);overflow:hidden;font-size:13px}
.segmented button{border:0;background:none;padding:0 12px;height:26px;color:var(--muted);cursor:pointer;transition:background .12s,color .12s}
.segmented button+button{border-left:1px solid var(--border)}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--hover);color:var(--text)}
.segmented button:focus-visible{outline-offset:-2px}

.tabs{display:flex;height:36px;border-bottom:1px solid var(--border);margin-bottom:24px;gap:0}
.tabs button{position:relative;border:0;background:none;padding:0 12px;color:var(--muted);cursor:pointer;font-size:14px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}
.tabs button:focus-visible{outline-offset:-2px}

.bc{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.bc a{color:var(--muted)} .bc a:hover{color:var(--text)}
.bc .sep{color:var(--border)} .bc b{font-weight:500}

/* Chips de filtro (filtros globais) */
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-control);background:transparent;font-size:13px;cursor:pointer;transition:background .12s}
.chip:hover{background:var(--hover)}
.chip .k{color:var(--muted)}
.chip.on{background:var(--hover)}
.chip .x{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;color:var(--muted);margin-right:-4px}
.chip .x:hover{color:var(--text);background:var(--border)}

/* Banner de alerta de página */
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border:1px solid var(--warning);border-radius:var(--r-surface);background:var(--surface);font-size:13px;margin:-16px 0 24px}
.banner.info{border-color:var(--info)} .banner.error{border-color:var(--error)}
.banner .x{background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-control)}
.banner .x:hover{background:var(--hover);color:var(--text)}

/* KPI */
.kpi{padding:14px 16px;height:92px;transition:border-color .12s;display:block;text-align:left;width:100%;color:inherit;font:inherit;cursor:default}
.kpi:hover{border-color:var(--muted)}
.kpi .h{display:flex;align-items:center;gap:6px}
.kpi .go{margin-left:auto;color:var(--muted);background:none;border:0;cursor:pointer;padding:0 2px;font-size:16px;line-height:1;border-radius:4px}
.kpi .go:hover{color:var(--text)}
.kpi .v{font-size:20px;font-weight:500;margin-top:10px;display:flex;align-items:baseline;white-space:nowrap}
.kpi .d{font-size:12px;margin-left:8px;font-weight:400}

/* =========================================================================
   5. GRÁFICOS
   ========================================================================= */
.ch{padding:16px 20px 14px;min-width:0}
.ch-t{display:flex;align-items:center;gap:8px;font-weight:500}
.ch-t .acts{margin-left:auto;display:flex;gap:6px}
.ch-v{font-size:22px;font-weight:500;margin-top:4px;line-height:1.3}
.ch-p{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.plot{margin-top:14px;position:relative;min-height:40px}
.plot svg{display:block;overflow:visible}
.ax{fill:var(--muted);font:11px var(--font-sans)}
.hit{fill:transparent}
.g:hover .hit{fill:var(--hover)}
.g .pt,.g .cur{opacity:0}
.g:hover .pt,.g:hover .cur{opacity:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.np{pointer-events:none}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.leg{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center}
.leg i,.tip i.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.leg i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed;background:none!important}
.donut-seg{transition:stroke-width .12s;cursor:default}
.donut-seg:hover{stroke-width:24}

.hl{display:flex;align-items:center;gap:8px;font-weight:500}
.hl .r{margin-left:auto;font-weight:400;font-size:13px}
.mini{display:flex;gap:3px;align-items:flex-end;height:48px;margin:14px 0 4px}
.mini b{flex:1;background:var(--brand);border-radius:2px;display:flex;flex-direction:column-reverse;overflow:hidden}
.mini b u{background:var(--error);display:block}
.sd{width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block;flex:none}
.sd.er{background:var(--error)} .sd.wn{background:var(--warning)} .sd.off{background:var(--muted)}

.rk{display:grid;grid-template-columns:20px 160px 1fr 120px;align-items:center;gap:10px;height:28px;padding:0 6px;border-radius:var(--r-control);font-size:13px}
.rk:hover{background:var(--hover)}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .tr{height:8px;border-radius:4px;overflow:hidden}
.rk .tr b{display:block;height:100%;background:var(--series-1);border-radius:4px}
.rk .vl{text-align:right;font-weight:500}
.bl{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;height:32px;font-size:13px}
.bl .tr{height:8px;border-radius:4px;background:var(--hover);position:relative}
.bl .tr i{display:block;height:100%;border-radius:4px}
.bl .tr u{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--text)}
.bl b{text-align:right;font-weight:500}
.dv{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;height:28px;font-size:13px;border-radius:var(--r-control)}
.dv:hover{background:var(--hover)}
.dv .tr{position:relative;height:100%}
.dv .tr::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:1px solid var(--muted)}
.dv .tr i{position:absolute;top:9px;height:10px;border-radius:2px}
.dv b{text-align:right;font-weight:500}
.fn{display:grid;grid-template-columns:190px 1fr 110px;align-items:center;gap:10px;height:34px;font-size:13px;border-radius:var(--r-control);padding:0 6px}
.fn:hover{background:var(--hover)}
.fn .tr{display:flex;justify-content:center}
.fn .tr i{display:block;height:20px;border-radius:4px;background:var(--series-2)}
.fn .vl{text-align:right}
.tm{display:flex;gap:2px;height:240px}
.tm>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tm .tile{border:1px solid;border-radius:var(--r-chart);padding:6px 10px;display:flex;align-items:baseline;gap:8px;font-size:12px;overflow:hidden;min-height:0;cursor:default}
.tm .tile .mu{flex:none}
.tm .tile b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk4>div{border:1px solid var(--border);border-radius:var(--r-surface);padding:12px 14px}

/* =========================================================================
   6. TABELA
   ========================================================================= */
.tb{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border);min-height:45px}
.tb .input{flex:1}
.tb.batch{background:var(--hover);font-size:13px}
.tw{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:13px}
.dt th,.dt td{height:35px;padding:0 12px;border:1px solid var(--border);border-top:0;text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dt th:first-child,.dt td:first-child{border-left:0}
.dt th:last-child,.dt td:last-child{border-right:0}
.dt tbody tr:last-child td{border-bottom:0}
.dt th{height:36px;font-weight:500;user-select:none}
.dt th small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.dt th.sortable{cursor:pointer}
.dt th .so{display:inline-block;width:12px;margin-left:4px;color:var(--muted);visibility:hidden;font-size:12px}
.dt th.sortable:hover .so{visibility:visible}
.dt th.sorted .so{visibility:visible;color:var(--text)}
.dt .cb{width:40px;min-width:40px;max-width:40px;padding:0 0 0 12px}
.dt .cb.exp{width:64px;min-width:64px;max-width:64px}
.dt .cb input{vertical-align:middle}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover{background:var(--hover)}
.dt tbody tr.clickable{cursor:pointer}
.dt tr.child td{background:var(--bg)}
.dt tr.child td.indent{padding-left:52px}
.dt .n{text-align:right}

/* =========================================================================
   TOOLTIP — gráfico (instantâneo, segue o cursor) e ajuda (? e i, 300 ms)
   ========================================================================= */
const tip=$('#tip');let TT=[],tipTimer=null,tipFor=null;
/* Registra o conteúdo do tooltip de gráfico: {sub, head, rows:[[cor,nome,valor,pct?]], total} */
const tt=o=>` data-tt="${TT.push(o)-1}"`;
const tipHTML=o=>(o.sub?`<div class="mu">${esc(o.sub)}</div>`:'')+`<div class="hd">${esc(o.head)}</div>`+
  (o.rows||[]).map(r=>`<div class="r"><span>${r[0]?`<i class="sw" style="background:${r[0]}"></i>`:''}${esc(r[1])}</span><b>${esc(r[2])}${r[3]!=null?` <span class="mu">(${esc(r[3])})</span>`:''}</b></div>`).join('')+
  (o.total!=null?`<hr><div class="r" style="margin:0"><span style="font-weight:500">Total</span><b>${esc(o.total)}</b></div>`:'');
function placeTip(x,y){const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+14,t=y-h-10;if(l+w>innerWidth-8)l=x-w-14;if(t<56)t=y+16;if(t+h>innerHeight-8)t=innerHeight-h-8;tip.style.left=Math.max(8,l)+'px';tip.style.top=t+'px'}
function hideTip(){clearTimeout(tipTimer);tip.classList.remove('show');tipFor=null}
document.addEventListener('mousemove',e=>{
  const c=e.target.closest('[data-tt]'),q=e.target.closest('[data-help]');
  if(c){clearTimeout(tipTimer);const o=TT[c.dataset.tt];if(!o)return;if(tipFor!==c){tip.className='tip';tip.innerHTML=tipHTML(o);tipFor=c}tip.classList.add('show');placeTip(e.clientX,e.clientY)}
  else if(q){if(tipFor!==q){hideTip();tipFor=q;tipTimer=setTimeout(()=>{tip.className='tip txt show';tip.textContent=q.dataset.help;placeTip(e.clientX,e.clientY)},300)}else if(tip.classList.contains('show'))placeTip(e.clientX,e.clientY)}
  else if(tipFor)hideTip();
});
/* Teclado: ajuda também abre no foco */
document.addEventListener('focusin',e=>{const q=e.target.closest('[data-help]');if(!q)return;const r=q.getBoundingClientRect();hideTip();tipFor=q;tipTimer=setTimeout(()=>{tip.className='tip txt show';tip.textContent=q.dataset.help;placeTip(r.right,r.top)},300)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-help]'))hideTip()});

/* =========================================================================
   POPOVER, DROPDOWN, MENU DE CONTEXTO E SUBMENU (DESIGN_SYSTEM §12.2)
   ========================================================================= */
let openPop=null;
function closePop(){if(openPop){openPop.el.remove();openPop.anchor?.setAttribute('aria-expanded','false');const a=openPop.anchor;openPop=null;return a}}
function popover(anchor,html,{width,align='left',onMount,sub=false}={}){
  if(!sub){const prev=openPop?.anchor;closePop();if(prev===anchor)return null}
  const el=document.createElement('div');el.className='pop';el.innerHTML=html;if(width)el.style.width=width+'px';
  document.body.append(el);
  /* place(): reposiciona após o conteúdo mudar de tamanho (ex.: calendário desenhado depois) */
  el.place=()=>{const r=anchor.getBoundingClientRect();el.style.minWidth=r.width+'px';
    let l=sub?r.right-4:(align==='right'?r.right-el.offsetWidth:r.left),t=sub?r.top-5:r.bottom+4;
    if(l+el.offsetWidth>innerWidth-8)l=sub?r.left-el.offsetWidth+4:innerWidth-el.offsetWidth-8;
    if(t+el.offsetHeight>innerHeight-8)t=Math.max(56,(sub?r.bottom:r.top-4)-el.offsetHeight);
    el.style.left=Math.max(8,l)+'px';el.style.top=t+'px'};
  el.place();
  if(!sub){openPop={el,anchor,at:performance.now()};anchor.setAttribute('aria-expanded','true')}
  onMount&&onMount(el);return el;
}
document.addEventListener('mousedown',e=>{if(openPop&&!e.target.closest('.pop')&&!openPop.anchor.contains(e.target))closePop()});
addEventListener('resize',()=>closePop());
addEventListener('scroll',e=>{if(openPop&&performance.now()-openPop.at>150&&!e.target.closest?.('.pop'))closePop()},true);

/* items: [{label, value, icon, checked, disabled, kbd, danger, children:[...], onClick}] · '-' separador · {group:'RÓTULO'} */
function menuHTML(items){return `<div class="menu" role="menu">`+items.map((it,i)=>it==='-'?'<hr>':it.group?`<div class="grp mono">${esc(it.group)}</div>`:
  `<button type="button" class="mi" role="menuitem" data-i="${i}" ${it.disabled?'disabled aria-disabled="true"':''}><span class="ck">${it.checked?ic('check',14,2):it.icon?ic(it.icon,14):''}</span>${esc(it.label)}${it.children?`<span class="sub">${ic('chevr',14)}</span>`:it.kbd?`<span class="kb">${esc(it.kbd)}</span>`:''}</button>`).join('')+'</div>'}
function menu(anchor,items,opts={}){
  let subEl=null,subTimer=null;
  const el=popover(anchor,menuHTML(items),{...opts,onMount:m=>wire(m,items,false)});
  function wire(m,its,isSub){
    const btns=$$('.mi:not([disabled])',m);
    btns.forEach(b=>{const it=its[b.dataset.i];
      b.onclick=()=>{if(it.children){openSub(b,it.children);return}closePop();subEl?.remove();it.onClick&&it.onClick(it)};
      b.onmouseenter=()=>{btns.forEach(x=>x.classList.remove('act'));if(!isSub){clearTimeout(subTimer);if(it.children)subTimer=setTimeout(()=>openSub(b,it.children),150);else{subEl?.remove();subEl=null}}};
    });
    m.addEventListener('keydown',e=>{const i=btns.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();btns[(i+1)%btns.length].focus()}
      if(e.key==='ArrowUp'){e.preventDefault();btns[(i-1+btns.length)%btns.length].focus()}
      if(e.key==='ArrowRight'&&!isSub){const it=its[document.activeElement?.dataset.i];if(it?.children){openSub(document.activeElement,it.children,true)}}
      if((e.key==='ArrowLeft'||e.key==='Escape')&&isSub){e.preventDefault();e.stopPropagation();const p=subEl.parent;subEl.remove();subEl=null;p.focus()}
    });
    setTimeout(()=>btns[0]?.focus({preventScroll:true}),0);
  }
  function openSub(b,children,focus){subEl?.remove();subEl=popover(b,menuHTML(children),{sub:true});subEl.parent=b;openPop.el.append(subEl);
    const r=b.getBoundingClientRect();subEl.style.position='fixed';
    subEl.onmouseenter=()=>clearTimeout(subTimer);
    const btns=$$('.mi',subEl);wire(subEl,children,true);if(!focus)setTimeout(()=>b.focus({preventScroll:true}),0)}
  return el;
}

/* =========================================================================
   MODAL (320/480/720, três faixas) e DRAWER (480/720) — DESIGN_SYSTEM §5, §12.5, §12.7
   ========================================================================= */
const layer=$('#layer');let dialogs=[];
function trapFocus(root){root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=$$('button:not([disabled]),input:not([disabled]),textarea,select,a[href],[tabindex="0"]',root).filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}})}
function openDialog(ov,box,onClose){
  const prev=document.activeElement;const d={ov,locked:false,close(){if(d.locked)return;ov.remove();dialogs=dialogs.filter(x=>x!==d);onClose&&onClose();prev?.focus?.({preventScroll:true})}};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)d.close()});
  layer.append(ov);dialogs.push(d);trapFocus(box);
  setTimeout(()=>($('[autofocus]',box)||$('.mf .btn:last-child,.df .btn:last-child,.xbtn',box))?.focus(),0);
  return d;
}
/* modal({title, body, size:320|480|720, actions:[{label, kind:'pri'|'dan'|'', onClick(d)}], confirmText}) */
function modal({title,body,size=320,actions=[],confirmText,onClose}){
  closePop();hideTip();
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${size>320?'m'+size:''}" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><div class="mb">${body}</div><div class="mf">${actions.map((a,i)=>`<button type="button" class="btn ${a.kind||''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
  const box=$('.modal',ov);const d=openDialog(ov,box,onClose);
  $$('[data-a]',box).forEach(b=>b.onclick=()=>{const a=actions[b.dataset.a];a.onClick?a.onClick(d,b):d.close()});
  if(confirmText){const inp=$('[data-confirm]',box),btn=$('.mf .btn:last-child',box);btn.disabled=true;inp.oninput=()=>btn.disabled=inp.value.trim()!==confirmText}
  d.box=box;
  /* Carregando: botão com spinner; ESC e clique fora ficam desativados até terminar */
  d.loading=(b,on)=>{d.locked=on;$$('.mf .btn',box).forEach(x=>x.disabled=on);if(on){b.dataset.l=b.innerHTML;b.innerHTML=`<span class="spin"></span>${b.innerHTML}`}else b.innerHTML=b.dataset.l};
  return d;
}
function drawer({title,body,size=480,actions=[],onMount}){
  closePop();hideTip();
  const ov=document.createElement('div');ov.className='overlay drawer-ov';
  ov.innerHTML=`<div class="drawer ${size===720?'d720':''}" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dh"><span id="dt">${esc(title)}</span><button type="button" class="xbtn" aria-label="Fechar">${ic('x',16)}</button></div><div class="db">${body}</div>${actions.length?`<div class="df">${actions.map((a,i)=>`<button type="button" class="btn ${a.kind||''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`;
  const box=$('.drawer',ov);const d=openDialog(ov,box);
  $('.xbtn',box).onclick=()=>d.close();
  $$('[data-a]',box).forEach(b=>b.onclick=()=>{const a=actions[b.dataset.a];a.onClick?a.onClick(d,b):d.close()});
  onMount&&onMount(box);return d;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(openPop){const a=closePop();a?.focus?.();return}const d=dialogs[dialogs.length-1];if(d)d.close()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gsearch')?.focus()}
});

/* =========================================================================
   TOAST — máx. 3, sucesso/info 4 s, aviso 6 s, erro e processando persistem (DESIGN_SYSTEM §5, §12.9)
   ========================================================================= */
const TOAST={success:['okc','var(--brand)',4000],info:['info','var(--info)',4000],warning:['alert','var(--warning)',6000],error:['alertc','var(--error)',0],processing:[null,null,0]};
function toast(title,desc='',kind='success',action){
  const box=$('#toasts'),d=document.createElement('div');d.className='ts';d.setAttribute('role',kind==='error'?'alert':'status');
  let timer=null,ms=0;
  const paint=(t,ds,k,act)=>{const [icn,c,dur]=TOAST[k];ms=dur;
    d.innerHTML=`<span class="ti">${k==='processing'?'<span class="spin s16"></span>':`<span style="color:${c};display:grid">${ic(icn,16,2)}</span>`}</span><div class="tc"><b>${esc(t)}</b>${ds?`<span>${esc(ds)}</span>`:''}${act?`<div class="ta"><button type="button" class="btn sm">${esc(act.label)}</button></div>`:''}</div><button type="button" class="x" aria-label="Fechar">${ic('x',14)}</button>`;
    $('.x',d).onclick=rm;if(act)$('.ta .btn',d).onclick=()=>{rm();act.onClick()};arm()};
  const rm=()=>{clearTimeout(timer);d.classList.add('out');setTimeout(()=>d.remove(),150)};
  const arm=()=>{clearTimeout(timer);if(ms)timer=setTimeout(rm,ms)};
  d.onmouseenter=()=>clearTimeout(timer);d.onmouseleave=arm;
  paint(title,desc,kind,action);box.append(d);while(box.children.length>3)box.firstChild.remove();
  /* "Processando" vira sucesso/erro no MESMO toast, sem empilhar outro */
  return {update:(t,ds,k='success',act)=>paint(t,ds,k,act),close:rm};
}

<script>
/* =========================================================================

   Cada gráfico é desenhado na largura real do card (px), nunca escalado.
   ========================================================================= */
const drawers=new Map();
const ro=new ResizeObserver(es=>es.forEach(e=>{const d=drawers.get(e.target);if(!d)return;const w=Math.floor(e.contentRect.width);if(w&&w!==d.w){d.w=w;d.fn(w)}}));
function mountChart(el,fn){const d={fn,w:Math.floor(el.clientWidth)};drawers.set(el,d);ro.observe(el);if(d.w)fn(d.w)}

const AX={L:52,T:8,B:22,R:8};
/* Escala "redonda" para o eixo Y: 5 marcas (0..4) */
function niceMax(v){if(!v||v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v/4))),s=v/4/e;const m=s<=1?1:s<=1.25?1.25:s<=2?2:s<=2.5?2.5:s<=5?5:10;return m*e*4}
const svgOpen=(w,h)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
const yTicks=(max,PH,f=fmt.short,x=AX.L-8)=>[0,1,2,3,4].map(i=>`<text class="ax" x="${x}" y="${AX.T+PH*(1-i/4)+4}" text-anchor="end">${f(max*i/4)}</text>`).join('');
const legend=items=>`<div class="leg">${items.map(([n,c,dash])=>`<span><i class="${dash?'dash':''}" style="${dash?`border-color:${c}`:`background:${c}`}"></i>${esc(n)}</span>`).join('')}</div>`;
const refLine=(x1,x2,y,label)=>`<line class="np" x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="4 4"/>${label?`<text class="ax np halo" x="${x2}" y="${y-5}" text-anchor="end">${esc(label)}</text>`:''}`;

/* Barras verticais — empilhadas (stacked) ou agrupadas.
   cfg: {labels, heads?, sub?, series:[{name,color,values}], stacked, ref:{value,label}, height:190, fmtV} */
function barChart(cfg){return w=>{
  const H=cfg.height||190,PW=w-AX.L-AX.R,PH=H-AX.T-AX.B,n=cfg.labels.length,gap=10,bw=(PW-gap*(n-1))/n,fv=cfg.fmtV||fmt.brl;
  const tot=cfg.labels.map((_,i)=>cfg.stacked?sum(cfg.series.map(s=>s.values[i])):Math.max(...cfg.series.map(s=>s.values[i]||0)));
  const max=niceMax(Math.max(...tot,cfg.ref?.value||0));const y=v=>AX.T+PH*(1-v/max);
  let o=svgOpen(w,H)+yTicks(max,PH),defs='';
  cfg.labels.forEach((l,i)=>{const x0=AX.L+i*(bw+gap),t=sum(cfg.series.map(s=>s.values[i]));
    const rows=cfg.series.map(s=>[s.color,s.name,fv(s.values[i]),cfg.stacked&&s.values[i]!=null&&t?fmt.pct(s.values[i]/t*100):null]);
    let bars='';
    if(cfg.stacked){const cp=uid();let acc=0;const top=y(t);defs+=`<clipPath id="${cp}"><rect x="${x0+bw*.17}" y="${top}" width="${bw*.66}" height="${AX.T+PH-top}" rx="2"/></clipPath>`;
      bars=`<g clip-path="url(#${cp})">`+cfg.series.map(s=>{const v=s.values[i]||0,h=PH*v/max;acc+=h;return `<rect x="${x0+bw*.17}" y="${AX.T+PH-acc}" width="${bw*.66}" height="${h}" style="fill:${s.color}"/>`}).join('')+'</g>'}
    else{const k=cfg.series.length,iw=bw*.66/k;bars=cfg.series.map((s,j)=>{const v=s.values[i];if(v==null)return '';const h=PH*v/max;return `<rect x="${x0+bw*.17+iw*j}" y="${AX.T+PH-h}" width="${Math.max(1,iw-1)}" height="${h}" rx="2" style="fill:${s.color}"/>`}).join('')}
    o+=`<g class="g"${tt({sub:cfg.sub,head:cfg.heads?cfg.heads[i]:l,rows,total:cfg.stacked?fv(t):null})}><rect class="hit" x="${x0}" y="${AX.T}" width="${bw}" height="${PH+AX.B-4}" rx="4"/>${bars}<text class="ax" x="${x0+bw/2}" y="${H-5}" text-anchor="middle">${esc(l)}</text></g>`});
  if(cfg.ref)o+=refLine(AX.L,w-AX.R,y(cfg.ref.value),cfg.ref.label);
  return o.replace(svgOpen(w,H),svgOpen(w,H)+`<defs>${defs}</defs>`)+'</svg>'}}

/* Linha / área. cfg: {labels, heads?, series:[{name,color,values,dashed,area}], stacked, height, fmtV, everyX} */
function lineChart(cfg){return w=>{
  const H=cfg.height||190,PW=w-AX.L-AX.R,PH=H-AX.T-AX.B,n=cfg.labels.length,fv=cfg.fmtV||fmt.brl;
  const cum=cfg.labels.map((_,i)=>{let a=0;return cfg.series.map(s=>cfg.stacked?(a+=s.values[i]||0):s.values[i])});
  const max=niceMax(Math.max(...cum.flat().filter(v=>v!=null)));
  const x=i=>AX.L+PW*i/(n-1),y=v=>AX.T+PH*(1-v/max),step=PW/(n-1),ev=cfg.everyX||Math.ceil(n/7);
  let o=svgOpen(w,H)+yTicks(max,PH);
  cfg.series.forEach((s,k)=>{const top=cfg.labels.map((_,i)=>`${x(i)},${y(cum[i][k])}`);
    if(cfg.stacked||s.area){const bot=cfg.labels.map((_,i)=>`${x(i)},${y(k&&cfg.stacked?cum[i][k-1]:0)}`).reverse();o+=`<polygon class="np" points="${top.concat(bot).join(' ')}" style="fill:${s.color};fill-opacity:${cfg.stacked?.24:.12}"/>`}
    o+=`<polyline class="ln np" points="${top.join(' ')}" style="stroke:${s.color}"${s.dashed?' stroke-dasharray="5 4"':''}/>`});
  cfg.labels.forEach((l,i)=>{const t=sum(cfg.series.map(s=>s.values[i]));
    o+=`<g class="g"${tt({sub:cfg.sub,head:cfg.heads?cfg.heads[i]:l,rows:cfg.series.map(s=>[s.color,s.name,fv(s.values[i])]),total:cfg.stacked?fv(t):null})}><rect x="${x(i)-step/2}" y="${AX.T}" width="${step}" height="${PH}" fill="transparent"/><line class="cur np" x1="${x(i)}" x2="${x(i)}" y1="${AX.T}" y2="${AX.T+PH}" stroke="var(--border)"/>`+
      cfg.series.map((s,k)=>cum[i][k]==null?'':`<circle class="pt np" cx="${x(i)}" cy="${y(cum[i][k])}" r="3" style="fill:${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')+
      (i%ev===0?`<text class="ax" x="${x(i)}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`:'')+'</g>'});
  return o+'</svg>'}}

/* Donut: diâmetro 160, espessura 20, 2 px entre fatias, total no centro, legenda à direita com valor e %. Máx. 5 fatias + Outros. */
function donutHTML(items,centerLabel,fv=fmt.brl){
  const sorted=[...items].sort((a,b)=>b[1]-a[1]);let data=sorted.slice(0,5);if(sorted.length>5)data.push(['Outros',sum(sorted.slice(5).map(x=>x[1]))]);
  const C=2*Math.PI*56,T=sum(data.map(x=>x[1]));let off=0;
  const segs=data.map(([n,v])=>{const l=C*v/T,c=corSecao(n),s=`<circle class="donut-seg" cx="80" cy="80" r="56" fill="none" style="stroke:${c}" stroke-width="20" stroke-dasharray="${Math.max(0,l-2)} ${C-l+2}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"${tt({head:n,rows:[[c,'Faturamento',fv(v),fmt.pct(v/T*100)]]})}/>`;off+=l;return s}).join('');
  return `<div style="display:flex;align-items:center;gap:32px;justify-content:center;padding:6px 0"><svg viewBox="0 0 160 160" width="160" height="160" style="overflow:visible">${segs}<text x="80" y="82" text-anchor="middle" style="font-size:22px;font-weight:500;fill:var(--text)">${fmt.short(T)}</text><text class="mono" x="80" y="100" text-anchor="middle" style="font:11px var(--font-mono);letter-spacing:.08em;fill:var(--muted)">${esc(centerLabel)}</text></svg>
  <div style="font-size:13px;min-width:220px">${data.map(([n,v])=>`<div style="display:flex;gap:10px;align-items:center;height:26px"><i style="width:8px;height:8px;border-radius:50%;background:${corSecao(n)}"></i>${esc(n)}<span style="margin-left:auto;padding-left:20px;font-weight:500">${fv(v)}</span><span class="mu" style="width:48px;text-align:right">${fmt.pct(v/T*100)}</span></div>`).join('')}</div></div>`}

/* Ranking: linha 28, posição mono, nome truncado 160, barra 8 px raio 4 em series-1, valor à direita. Máx. 10. */
const rankHTML=(items,fv=fmt.brl)=>{const m=Math.max(...items.map(x=>x[1]));return items.slice(0,10).map(([n,v],i)=>`<div class="rk"${tt({head:n,rows:[['var(--series-1)','Faturamento',fv(v)]]})}><span class="mono">${i+1}</span><span class="nm">${esc(n)}</span><span class="tr"><b style="width:${v/m*100}%"></b></span><span class="vl">${fv(v)}</span></div>`).join('')};

/* Treemap: fatias em colunas; preenchimento da série a 22% + borda 1 px da série; texto em --text (legível nos dois temas) */
function treemapHTML(items){const s=[...items].sort((a,b)=>b[1]-a[1]),T=sum(s.map(x=>x[1]));const cols=[[s[0]],s.slice(1,3),s.slice(3)];
  return `<div class="tm">${cols.map(c=>`<div style="flex:${sum(c.map(x=>x[1]))}">${c.map(([n,v])=>{const col=corSecao(n);return `<div class="tile" style="flex:${v};border-color:${col};background:color-mix(in srgb,${col} 22%,var(--surface))"${tt({head:n,rows:[[col,'Faturamento',fmt.brl(v),fmt.pct(v/T*100)]]})}><b>${esc(n)}</b><span class="mu">${fmt.pct(v/T*100)}</span></div>`}).join('')}</div>`).join('')}</div>`}

/* Pareto (curva ABC): barras + acumulado (series-2) + linha de 80% */
function paretoChart(items){return w=>{
  const H=210,R=40,PW=w-AX.L-R,PH=H-AX.T-AX.B,n=items.length,bw=PW/n,T=sum(items.map(x=>x[1])),max=niceMax(Math.max(...items.map(x=>x[1])));
  let a=0,pts=[],o=svgOpen(w,H)+yTicks(max,PH)+[0,50,100].map(v=>`<text class="ax" x="${w-R+8}" y="${AX.T+PH*(1-v/100)+4}">${v}%</text>`).join('');
  items.forEach(([nm,v],i)=>{const prev=a/T;a+=v;const cp=a/T,h=PH*v/max,x=AX.L+bw*i,cx=x+bw/2,c=prev<.8?'var(--series-1)':'var(--series-3)';pts.push(`${cx},${AX.T+PH*(1-cp)}`);
    o+=`<g class="g"${tt({head:nm,rows:[[c,'Faturamento',fmt.brl(v)],['var(--series-2)','Acumulado',fmt.pct(cp*100)],[null,'Classe',prev<.8?'A':prev<.95?'B':'C']]})}><rect class="hit" x="${x}" y="${AX.T}" width="${bw}" height="${PH}" rx="4"/><rect x="${x+bw*.17}" y="${AX.T+PH-h}" width="${bw*.66}" height="${h}" rx="2" style="fill:${c}"/><text class="ax" x="${cx}" y="${H-5}" text-anchor="middle">${esc(nm.length>Math.floor(bw/7)?nm.slice(0,Math.max(3,Math.floor(bw/7)-1))+'…':nm)}</text><circle class="pt np" cx="${cx}" cy="${AX.T+PH*(1-cp)}" r="3" style="fill:var(--series-2)" stroke="var(--surface)" stroke-width="2"/></g>`});
  return o+`<polyline class="ln np" points="${pts.join(' ')}" style="stroke:var(--series-2)"/>`+refLine(AX.L,w-R,AX.T+PH*.2,'80%')+'</svg>'}}

/* Bolhas: x = giro, y = margem, área = faturamento; medianas tracejadas em --border */
function bubbleChart(items){return w=>{
  const H=230,PW=w-AX.L-AX.R-70,PH=H-AX.T-AX.B,x=g=>AX.L+PW*g/14,y=m=>AX.T+PH*(1-(m-10)/30),med=a=>{const s=[...a].sort((p,q)=>p-q);return s[Math.floor(s.length/2)]};
  const mx=med(items.map(p=>p[1])),my=med(items.map(p=>p[2]));
  let o=svgOpen(w,H)+[10,20,30,40].map(m=>`<text class="ax" x="${AX.L-8}" y="${y(m)+4}" text-anchor="end">${m}%</text>`).join('')+[0,4,8,12].map(g=>`<text class="ax" x="${x(g)}" y="${H-5}" text-anchor="middle">${g}×</text>`).join('')+
    `<line class="np" x1="${x(mx)}" x2="${x(mx)}" y1="${AX.T}" y2="${AX.T+PH}" stroke="var(--border)" stroke-dasharray="4 4"/><line class="np" x1="${AX.L}" x2="${AX.L+PW}" y1="${y(my)}" y2="${y(my)}" stroke="var(--border)" stroke-dasharray="4 4"/>`;
  const fmax=Math.max(...items.map(p=>p[3]));items.forEach(([n,g,m,f])=>{const r=5+Math.sqrt(f/fmax)*13,c=corSecao(n);o+=`<g class="g"${tt({head:n,rows:[[c,'Giro',nf(1).format(g)+' vezes/mês'],[c,'Margem bruta',fmt.pct(m)],[c,'Faturamento',fmt.brl(f)]]})}><circle cx="${x(g)}" cy="${y(m)}" r="${r}" style="fill:${c}" fill-opacity=".8" stroke="var(--surface)" stroke-width="2"/><text class="ax halo" x="${x(g)+r+4}" y="${y(m)+4}">${esc(n)}</text></g>`});
  return o+'</svg>'}}

/* Escala sequencial de 5 passos sobre brand (10 → 100%); sem dado = --hover */
const SEQ=[.1,.3,.5,.75,1];
const seqStep=v=>v==null?-1:Math.min(4,Math.floor(v*5));
const seqFill=st=>st<0?'var(--hover)':`color-mix(in srgb,var(--brand) ${SEQ[st]*100}%,var(--hover))`;
const seqLegend=(a,b)=>`<div class="leg" style="align-items:center;gap:4px">${esc(a)}&nbsp;${SEQ.map((_,i)=>`<i style="width:14px;height:14px;border-radius:3px;margin:0;background:${seqFill(i)}"></i>`).join('')}&nbsp;${esc(b)}</div>`;
/* Mapa de calor: células 28 × 28, raio 4, gap 2 */
function heatHTML(d){const max=Math.max(...d.valores.flat()),cw=30,W=40+d.horas.length*cw,H=d.dias.length*cw+20;let o=`<svg width="${W}" height="${H}" style="display:block;margin:0 auto">`;
  d.dias.forEach((dn,r)=>{o+=`<text class="ax" x="32" y="${r*cw+18}" text-anchor="end">${dn}</text>`;d.horas.forEach((h,c)=>{const v=d.valores[r][c];o+=`<rect x="${40+c*cw}" y="${r*cw}" width="28" height="28" rx="4" style="fill:${seqFill(seqStep(v/max))}"${tt({head:`${dn} · ${h}h`,rows:[['var(--brand)','Clientes',fmt.int(v)]]})}/>`})});
  d.horas.forEach((h,c)=>{if(c%2===0)o+=`<text class="ax" x="${40+c*cw+14}" y="${H-4}" text-anchor="middle">${h}h</text>`});
  return o+'</svg>'+seqLegend('Menos','Mais')}
/* Mapa em grade por UF (tile map) */
const UFPOS={RR:[1,0],AP:[3,0],AM:[1,1],PA:[2,1],MA:[3,1],PI:[4,1],CE:[5,1],RN:[6,1],AC:[0,2],RO:[1,2],MT:[2,2],TO:[3,2],BA:[4,2],PE:[5,2],PB:[6,2],MS:[1,3],GO:[2,3],DF:[3,3],MG:[4,3],SE:[5,3],AL:[6,3],PR:[2,4],SP:[3,4],RJ:[4,4],ES:[5,4],SC:[2,5],RS:[2,6]};
function tileHTML(uf){const max=Math.max(...Object.values(uf).map(v=>v.faturamento));let o=`<svg width="${7*68}" height="${7*48}" style="display:block;margin:0 auto">`;
  for(const [k,[c,r]] of Object.entries(UFPOS)){const v=uf[k],st=v?seqStep(v.faturamento/max):-1,dark=st>=3;
    o+=`<g${tt({head:k,rows:[['var(--brand)','Faturamento',v?fmt.brl(v.faturamento):'—'],[null,'Lojas',v?fmt.int(v.lojas):'—']]})}><rect x="${c*68}" y="${r*48}" width="64" height="44" rx="6" style="fill:${seqFill(st)}" stroke="var(--border)"/><text x="${c*68+32}" y="${r*48+20}" text-anchor="middle" style="font-size:13px;font-weight:500;fill:${dark?'var(--on-accent)':'var(--text)'}">${k}</text><text x="${c*68+32}" y="${r*48+35}" text-anchor="middle" style="font-size:10px;fill:${dark?'var(--on-accent)':'var(--muted)'}">${v?fmt.short(v.faturamento):'—'}</text></g>`}
  return o+'</svg>'+seqLegend('Menor','Maior faturamento')}

/* Cor de status de meta: ≥ 100% brand · 80–99% warning · < 80% error */
const goalColor=p=>p>=1?'var(--brand)':p>=.8?'var(--warning)':'var(--error)';
const gaugeHTML=p=>`<svg viewBox="0 0 200 120" width="200" height="120"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--hover)" stroke-width="14" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" style="stroke:${goalColor(p)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${251.3*Math.min(p,1)} 251.3"/><text x="100" y="92" text-anchor="middle" style="font-size:22px;font-weight:500;fill:var(--text)">${fmt.pct(p*100).replace(',0','')}</text><text x="100" y="112" text-anchor="middle" style="font:11px var(--font-mono);letter-spacing:.08em;fill:var(--muted)">DA META MENSAL</text></svg>`;
/* Bullet: trilho --hover, preenchimento por status, traço de 2 px --text marca a meta */
const bulletHTML=items=>items.map(([n,p,f,meta])=>`<div class="bl"${tt({head:n,rows:[[goalColor(p),'Atingido',fmt.pct(p*100)],[null,'Meta',f==='brl'?fmt.brl(meta):fmt.pct(meta)]]})}><span>${esc(n)}</span><div class="tr"><i style="width:${Math.min(p,1.2)/1.2*100}%;background:${goalColor(p)}"></i><u style="left:${1/1.2*100}%"></u></div><b>${Math.round(p*100)}%</b></div>`).join('')+`<div class="mu sm" style="margin-top:6px">Traço vertical = meta (100%)</div>`;
/* Barras divergentes: verde à direita (acima), vermelho à esquerda (abaixo) */
const divergeHTML=items=>{const m=Math.max(...items.map(x=>Math.abs(x[1])))*1.1;return items.map(([n,v])=>`<div class="dv"${tt({head:n,rows:[[v>=0?'var(--brand)':'var(--error)','vs. ano anterior',fmt.pct(v,true)]]})}><span>${esc(n)}</span><div class="tr"><i style="${v>=0?`left:50%;width:${v/m*50}%;background:var(--brand)`:`right:50%;width:${-v/m*50}%;background:var(--error)`}"></i></div><b class="${v>=0?'good':'bad'}">${fmt.pct(v,true)}</b></div>`).join('')};
/* Funil: barra centralizada em series-2, valor e conversão da etapa anterior */
const funnelHTML=F=>F.map(([n,v],i)=>`<div class="fn"${tt({head:n,rows:[['var(--series-2)','Usuários',fmt.int(v)],[null,'Da etapa anterior',i?fmt.pct(v/F[i-1][1]*100):'—']]})}><span>${esc(n)}</span><span class="tr"><i style="width:${v/F[0][1]*100}%"></i></span><span class="vl"><b style="font-weight:500">${fmt.int(v)}</b> <span class="mu">${i?fmt.pct(v/F[i-1][1]*100):''}</span></span></div>`).join('');
/* Cascata: totais em series-2, reduções em error */
function waterfallChart(st){return w=>{
  const steps=st.map(s=>[...s]);steps[steps.length-1][1]=sum(steps.slice(0,-1).map(s=>s[1]));
  const H=210,PW=w-AX.L-AX.R,PH=H-AX.T-AX.B,n=steps.length,bw=PW/n,mx=niceMax(steps[0][1]),y=v=>AX.T+PH*(1-v/mx);let run=0,o=svgOpen(w,H)+yTicks(mx,PH);
  steps.forEach(([nm,v,t],i)=>{const tot=t==='total',a=tot?0:run,b=tot?v:run+v;if(i===0)run=v;else if(!tot)run+=v;const c=tot?'var(--series-2)':'var(--error)',x=AX.L+bw*i+bw*.2;
    o+=`<g class="g"${tt({head:nm,rows:[[c,v<0?'Redução':'Valor',fmt.brl(Math.abs(v))]]})}><rect class="hit" x="${AX.L+bw*i}" y="${AX.T}" width="${bw}" height="${PH}" rx="4"/><rect x="${x}" y="${y(Math.max(a,b))}" width="${bw*.6}" height="${Math.max(1,Math.abs(y(a)-y(b)))}" rx="2" style="fill:${c}"/><text class="ax" x="${x+bw*.3}" y="${y(Math.max(a,b))-5}" text-anchor="middle">${(v<0?'−':'')+fmt.short(Math.abs(v))}</text><text class="ax" x="${x+bw*.3}" y="${H-5}" text-anchor="middle">${esc(nm)}</text>${i<n-1?`<line class="np" x1="${x+bw*.6}" x2="${x+bw}" y1="${y(run)}" y2="${y(run)}" stroke="var(--muted)" stroke-dasharray="2 2"/>`:''}</g>`});
  return o+'</svg>'}}
/* Linha do tempo (Gantt simples) */
function timelineChart(R,hoje){return w=>{const L=180,x=m=>L+(w-L-8)*m/12,hh=22+R.length*30;let o=svgOpen(w,hh+20);
  MESES.forEach((m,i)=>{o+=`<text class="ax" x="${x(i+.5)}" y="14" text-anchor="middle">${m}</text><line class="np" x1="${x(i)}" x2="${x(i)}" y1="22" y2="${hh}" stroke="var(--border)"/>`});
  R.forEach(([n,a,b,t],i)=>{const c=COR_CAMPANHA[t];o+=`<g class="g"${tt({head:n,rows:[[c,t,MESES[Math.floor(a)]+' – '+MESES[Math.min(11,Math.floor(b))]]]})}><rect class="hit" x="0" y="${22+i*30}" width="${w}" height="30" rx="4"/><text x="8" y="${42+i*30}" style="font-size:13px;fill:var(--text)">${esc(n)}</text><rect x="${x(a)}" y="${27+i*30}" width="${x(b)-x(a)}" height="20" rx="4" style="fill:${c}"/></g>`});
  return o+`<line class="np" x1="${x(hoje)}" x2="${x(hoje)}" y1="18" y2="${hh}" stroke="var(--text)" stroke-dasharray="3 3"/><text class="ax" x="${x(hoje)}" y="${hh+14}" text-anchor="middle" style="fill:var(--text)">Hoje</text></svg>`}}
/* Sparkline: altura 24, 1,5 px, cor semântica do delta, sem eixos nem tooltip */
const sparkHTML=(v,color)=>{const mn=Math.min(...v),mx=Math.max(...v);return `<svg viewBox="0 0 120 24" preserveAspectRatio="none" style="width:100%;height:24px;margin-top:8px;display:block"><polyline fill="none" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" style="stroke:${color}" points="${v.map((a,k)=>`${k*120/(v.length-1)},${23-(a-mn)/((mx-mn)||1)*22}`).join(' ')}"/></svg>`};
/* Indicador de saúde: barras de 48 px, verde = OK, vermelho = erro empilhado */
const miniHTML=bars=>`<div class="mini">${bars.map(b=>{const t=b.ok+b.erro,m=100;return `<b style="height:${t}%"${tt({head:'Hora',rows:[['var(--brand)','OK',fmt.int(b.ok)],['var(--error)','Com erro',fmt.int(b.erro)]]})}><u style="height:${t?b.erro/t*100:0}%"></u></b>`}).join('')}</div>`;

/* Card de gráfico com anatomia obrigatória: título + i → valor de destaque → período (+ badge desatualizado) → plotagem → legenda */
const chartCard=({title,helpText,value,period,stale,body,legendHTML='',span,id})=>`<div class="card ch${span?' span2':''}"${id?` id="${id}"`:''}><div class="ch-t">${esc(title)} ${help(helpText,'i')}</div><div class="ch-v">${value}</div><div class="ch-p">${esc(period)}${stale?` <span class="badge wn">${esc(stale)}</span>`:''}</div><div class="plot">${body}</div>${legendHTML}</div>`;
</script>
<script>
/* =========================================================================
   ESTADOS DE CARREGAMENTO, VAZIO E ERRO (DESIGN_SYSTEM §12.6)
   ========================================================================= */
const SK={
  kpi:()=>`<div class="card kpi" aria-busy="true"><div class="skel" style="width:80px;height:10px;margin-top:2px"></div><div class="skel" style="width:120px;height:20px;margin-top:18px"></div></div>`,
  chart:(h=190)=>`<div style="display:flex;align-items:flex-end;gap:10px;height:${h}px;padding-left:52px;padding-bottom:18px" aria-busy="true">${[62,48,70,55,66,80,58,74,52,68,77,60].map(v=>`<div class="skel" style="flex:1;height:${v}%;border-radius:2px"></div>`).join('')}</div>`,
  rows:(n=8)=>[...Array(n)].map(()=>`<div style="height:35px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border)"><div class="skel" style="height:10px;width:${40+Math.random()*50}%"></div></div>`).join(''),
  block:h=>`<div class="skel" style="height:${h}px;border-radius:var(--r-surface)"></div>`
};
const emptyHTML=(title,desc,actionLabel,icon='inbox')=>`<div class="empty"><span class="mu">${ic(icon,24)}</span><div class="et">${esc(title)}</div>${desc?`<div class="ed">${esc(desc)}</div>`:''}${actionLabel?`<button type="button" class="btn" data-empty-act>${esc(actionLabel)}</button>`:''}</div>`;
const errorHTML=(err,page)=>`<div class="empty${page?' page':''}" role="alert"><span style="color:var(--error)">${ic('alertc',16,2)}</span><div class="et">Não foi possível carregar</div><div class="ed">${esc(err?.message||'Tente novamente em instantes.')}</div>${page&&err?.ref?`<div class="ref">${esc(err.ref)}</div>`:''}<button type="button" class="btn" data-retry>${ic('refresh',14)}Tentar novamente</button></div>`;

/* Carrega um bloco: skeleton → dados | vazio | erro (com "Tentar novamente"). Ignora respostas de rotas antigas. */
let routeToken=0;
async function load(el,{endpoint,params,skeleton,isEmpty,empty,render,frame=h=>h,onError,onEmpty}){
  const tok=routeToken;el.innerHTML=skeleton;
  try{const data=await api.get(endpoint,params);if(tok!==routeToken||!el.isConnected)return;
    if(isEmpty&&isEmpty(data)){el.innerHTML=empty;onEmpty&&onEmpty(data);const b=$('[data-empty-act]',el);if(b)b.onclick=()=>clearFilters();return}
    render(data)}
  catch(err){if(tok!==routeToken||!el.isConnected)return;el.innerHTML=frame(errorHTML(err));onError&&onError(err);$('[data-retry]',el).onclick=()=>load(el,{endpoint,params,skeleton,isEmpty,empty,render,frame,onError,onEmpty})}
}

/* =========================================================================
   SHELL — topbar, sidebar, menu secundário, rotas
   ========================================================================= */
const NAV=[['visao-geral','Visão geral','home'],['vendas','Vendas','table'],['dashboards','Dashboards','chart'],'-',['produtos','Produtos','db'],['fornecedores','Fornecedores','users'],['metas','Metas','file'],'-',['alertas','Alertas','bell',true],['logs','Logs','list'],'-',['configuracoes','Configurações','gear'],'-',['ds','Design System','book']];
function renderSidebar(active){
  $('#sidebar').innerHTML=NAV.map(i=>i==='-'?'<hr>':`<a href="#/${i[0]}" class="${i[0]===active?'on':''}" ${i[0]===active?'aria-current="page"':''} aria-label="${i[1]}"><span class="i">${ic(i[2])}${i[3]?'<span class="dot"></span>':''}</span><span class="t">${i[1]}</span></a>`).join('');
}
const effectiveTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function setTheme(t){const r=document.documentElement;if(t==='system'){delete r.dataset.theme;try{localStorage.removeItem('bi-theme')}catch(e){}}else{r.dataset.theme=t;try{localStorage.setItem('bi-theme',t)}catch(e){}}paintThemeBtn()}
const paintThemeBtn=()=>{const b=$('#themeBtn');if(b){const d=effectiveTheme()==='dark';b.innerHTML=ic(d?'sun':'moon');b.setAttribute('aria-label',d?'Mudar para tema claro':'Mudar para tema escuro');b.title=b.getAttribute('aria-label')}};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn);

function renderTopbar(){const s=state.sessao;
  $('#topbar').innerHTML=`<a class="logo" href="#/visao-geral" aria-label="Início"><svg width="22" height="22" viewBox="0 0 24 24" style="fill:currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></a>
  <div class="crumb"><span class="sep">/</span>${esc(s.rede)} <span class="badge">${esc(s.rede_tipo)}</span><span class="sep">/</span>${esc(s.setor)}<span class="sep">/</span>${esc(s.loja)} ${s.ao_vivo?'<span class="badge wn">Ao vivo</span>':''}</div>
  <button type="button" class="btn pill" id="viewsBtn" aria-haspopup="menu">Visões salvas</button>
  <div class="spacer"></div>
  <button type="button" class="feedback" id="fbBtn">Feedback</button>
  <label class="search">${ic('search',14)}<input id="gsearch" placeholder="Buscar…" autocomplete="off" aria-label="Buscar páginas"><kbd>Ctrl K</kbd></label>
  <button type="button" class="ib" id="themeBtn"></button>
  <button type="button" class="ib" id="bellBtn" aria-label="Notificações" aria-haspopup="dialog">${ic('bell')}<span class="dot"></span></button>
  <button type="button" class="ib avatar" id="avatarBtn" aria-label="Conta de ${esc(s.usuario.nome)}" aria-haspopup="menu">${esc(s.usuario.inicial)}</button>`;
  paintThemeBtn();
  $('#themeBtn').onclick=()=>setTheme(effectiveTheme()==='dark'?'light':'dark');
  $('#viewsBtn').onclick=e=>menu(e.currentTarget,[{group:'Visões desta loja'},{label:'Nenhuma visão salva',disabled:true},'-',{label:'Salvar visão atual…',icon:'download',onClick:saveViewModal}]);
  $('#avatarBtn').onclick=e=>menu(e.currentTarget,[{group:s.usuario.email},{label:'Preferências',onClick:()=>go('configuracoes')},{label:'Aparência',children:[{label:'Sistema',checked:!document.documentElement.dataset.theme,onClick:()=>setTheme('system')},{label:'Claro',checked:document.documentElement.dataset.theme==='light',onClick:()=>setTheme('light')},{label:'Escuro',checked:document.documentElement.dataset.theme==='dark',onClick:()=>setTheme('dark')}]},'-',{label:'Sair',onClick:()=>toast('Sessão encerrada','Nesta referência, sair apenas demonstra o toast.','info')}],{align:'right'});
  $('#bellBtn').onclick=e=>openNotifications(e.currentTarget);
  $('#fbBtn').onclick=feedbackModal;
  const gs=$('#gsearch');gs.oninput=()=>searchPop(gs);gs.onfocus=()=>gs.value&&searchPop(gs);
  gs.onkeydown=e=>{if(e.key==='ArrowDown'&&openPop){e.preventDefault();$('.mi',openPop.el)?.focus()}if(e.key==='Enter'){$('.mi',openPop?.el||document.createElement('div'))?.click()}};
}
const SEARCHABLE=()=>[...NAV.filter(x=>x!=='-').map(x=>[x[1],x[0],'Página']),...DS_PAGES.map(p=>[p[1],'ds/'+p[0],'Design System'])];
function searchPop(inp){const q=inp.value.trim().toLowerCase();if(!q){closePop();return}
  const res=SEARCHABLE().filter(x=>x[0].toLowerCase().includes(q)).slice(0,8);
  if(openPop?.anchor!==inp.parentElement)closePop();else openPop.el.remove(),openPop=null;
  const el=popover(inp.parentElement,res.length?menuHTML([{group:'Ir para'},...res.map(r=>({label:r[0]+' · '+r[2]}))]):`<div class="empty" style="min-height:0;padding:16px"><div class="ed">Nenhum resultado para “${esc(inp.value)}”</div></div>`,{width:280});
  $$('.mi',el).forEach((b,i)=>b.onclick=()=>{closePop();inp.value='';go(res[i][1])});
}
function openNotifications(anchor){
  const el=popover(anchor,`<div class="ps" style="display:flex;align-items:center"><b style="font-weight:500">Notificações</b><a href="#/alertas" class="link" style="margin-left:auto" id="nAll">Ver todas</a></div><div id="nList" style="width:340px"></div>`,{align:'right'});if(!el)return;
  $('#nAll',el).onclick=()=>closePop();
  load($('#nList',el),{endpoint:'alertas',skeleton:`<div style="padding:8px">${SK.rows(3)}</div>`,isEmpty:d=>!d.itens.length,empty:emptyHTML('Tudo em dia','Nenhum alerta novo.'),
    render:d=>{setTimeout(()=>el.place(),0);$('#nList',el).innerHTML=d.itens.slice(0,3).map(a=>`<a href="#/alertas" class="mi" style="height:auto;padding:8px 12px;border-radius:0;align-items:flex-start"><span class="sd ${a.nivel==='erro'?'er':a.nivel==='aviso'?'wn':'off'}" style="margin-top:6px"></span><span style="white-space:normal"><span style="display:block">${esc(a.titulo)}</span><span class="mu sm">${esc(a.loja)} · ${fmt.ago(a.quando)}</span></span></a>`).join('')}});
}
function feedbackModal(){
  const d=modal({title:'Enviar feedback',size:480,body:`<div class="fgroup" style="max-width:none"><label for="fbT">O que podemos melhorar?</label><textarea class="field" id="fbT" autofocus placeholder="Descreva o que aconteceu ou o que você esperava…"></textarea><span class="help">Seu nome e a página atual são enviados junto.</span></div>`,
    actions:[{label:'Cancelar'},{label:'Enviar',kind:'pri',onClick:async(d,b)=>{const t=$('#fbT',d.box);if(!t.value.trim()){t.classList.add('invalid');if(!$('.err',d.box))t.insertAdjacentHTML('afterend','<span class="err">Escreva uma mensagem antes de enviar.</span>');t.focus();return}
      d.loading(b,true);await sleep(900);d.locked=false;d.close();toast('Feedback enviado','Obrigado! A equipe vai analisar.')}}]});
}
function saveViewModal(){
  modal({title:'Salvar visão',size:480,body:`<div class="fgroup" style="max-width:none"><label for="vn">Nome da visão</label><input class="field" id="vn" autofocus placeholder="Ex.: Hortifruti · Capital"><span class="help">Salva período e filtros atuais para esta loja.</span></div>`,
    actions:[{label:'Cancelar'},{label:'Salvar',kind:'pri',onClick:(d)=>{d.close();toast('Visão salva','Disponível em “Visões salvas”.')}}]});
}

/* Rotas: #/visao-geral · #/dashboards/<aba> · #/alertas · #/configuracoes/<aba> · #/ds/<página> */
const go=path=>{location.hash='#/'+path};
function route(){
  routeToken++;closePop();hideTip();TT=[];drawers.clear();ro.disconnect();dialogs.slice().forEach(d=>{d.locked=false;d.close()});
  const [name='visao-geral',sub]=location.hash.replace(/^#\/?/,'').split('/');
  renderSidebar(name);
  const isDS=name==='ds';document.body.classList.toggle('has-subnav',isDS);$('#subnav').hidden=!isDS;
  const page=$('#page');page.innerHTML='';scrollTo(0,0);
  ({'visao-geral':pageOverview,dashboards:pageDashboards,alertas:pageAlerts,configuracoes:pageSettings,ds:pageDS}[name]||pagePlaceholder)(page,sub,name);
  document.title=(page.querySelector('h1')?.firstChild?.textContent?.trim()||'BI')+' — BI Supermercado';
}
addEventListener('hashchange',route);

/* Cabeçalho de página: H1 (+ badge) + subtítulo à esquerda; ações à direita */
const pageHeader=(title,sub,actions='',badge='',tight)=>`<div class="ph${tight?' tight':''}"><div><h1>${esc(title)}${badge}</h1><div class="mu">${esc(sub)}</div></div><div class="spacer"></div>${actions}</div>`;

/* =========================================================================
   FILTROS GLOBAIS + SELETOR DE PERÍODO (DESIGN_SYSTEM §12.1, §12.3)
   ========================================================================= */
function chipsHTML(){const f=state.filtros,c=[['loja','Loja',f.loja,'Todas'],['regiao','Região',f.regiao,'Todas'],['secao','Seção',f.secao.length?(f.secao.length===1?f.secao[0]:f.secao.length):'Todas',null],['canal','Canal',f.canal,'Todos']];
  const any=f.loja!=='Todas'||f.regiao!=='Todas'||f.secao.length||f.canal!=='Todos';
  return c.map(([k,l,v,def])=>{const on=k==='secao'?f.secao.length>0:v!==def;return `<button type="button" class="chip${on?' on':''}" data-chip="${k}" aria-haspopup="menu"><span class="k">${l}:</span>${esc(v)}${on?`<span class="x" data-clear="${k}" role="button" aria-label="Remover filtro ${l}">${ic('x',12)}</span>`:chev}</button>`}).join('')+(any?`<button type="button" class="link" data-clearall>Limpar filtros</button>`:'');
}
function wireChips(el,onChange){
  el.innerHTML=chipsHTML();const s=state.sessao,f=state.filtros;
  const opts={loja:s.lojas,regiao:s.regioes,canal:s.canais};
  $$('[data-chip]',el).forEach(b=>b.onclick=e=>{const k=b.dataset.chip;
    if(e.target.closest('[data-clear]')){f[k]=k==='secao'?[]:opts[k][0];wireChips(el,onChange);onChange();return}
    if(k==='secao')return multiSelect(b,s.secoes,f.secao,v=>{f.secao=v;wireChips(el,onChange);onChange()});
    menu(b,opts[k].map(o=>({label:o,checked:f[k]===o,onClick:()=>{f[k]=o;wireChips(el,onChange);onChange()}})));
  });
  const ca=$('[data-clearall]',el);if(ca)ca.onclick=()=>{clearFilters(false);wireChips(el,onChange);onChange()};
}
function clearFilters(rerender=true){Object.assign(state.filtros,{loja:'Todas',regiao:'Todas',secao:[],canal:'Todos'});if(rerender)route()}
/* Multisseleção: busca no topo, checkboxes brand, rodapé Aplicar */
function multiSelect(anchor,options,selected,onApply){
  const sel=new Set(selected);
  const el=popover(anchor,`<div class="ps"><div class="input">${ic('search',14)}<input placeholder="Buscar seção…" aria-label="Buscar seção"></div></div><div class="menu" style="min-width:220px"></div><div class="pf"><button type="button" class="link" data-x style="margin-right:auto">Limpar</button><button type="button" class="btn pri" data-ok>Aplicar</button></div>`,{width:240});if(!el)return;
  const list=$('.menu',el),inp=$('input',el);
  const draw=()=>{const q=inp.value.toLowerCase(),o=options.filter(x=>x.toLowerCase().includes(q));list.innerHTML=o.length?o.map(x=>`<label class="mi"><input type="checkbox" value="${esc(x)}" ${sel.has(x)?'checked':''}><i style="width:8px;height:8px;border-radius:50%;background:${corSecao(x)}"></i>${esc(x)}</label>`).join(''):`<div class="ed mu" style="padding:12px 8px;font-size:13px">Nenhuma seção encontrada</div>`;
    $$('input',list).forEach(c=>c.onchange=()=>c.checked?sel.add(c.value):sel.delete(c.value))};
  inp.oninput=draw;draw();el.place();setTimeout(()=>inp.focus(),0);
  $('[data-x]',el).onclick=()=>{sel.clear();draw()};
  $('[data-ok]',el).onclick=()=>{closePop();onApply([...sel])};
}
const PRESETS=[['hoje','Hoje'],['ontem','Ontem'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['mes','Mês atual'],['mesant','Mês anterior'],['12m','Últimos 12 meses'],['custom','Personalizado']];
function periodPicker(anchor,onApply){
  const today=new Date();today.setHours(0,0,0,0);
  let view=new Date(today.getFullYear(),today.getMonth(),1),ini=state.periodo.ini?new Date(state.periodo.ini):null,fim=state.periodo.fim?new Date(state.periodo.fim):null,preset=state.periodo.preset,cmp=state.periodo.comparar;
  const el=popover(anchor,`<div class="cal"><div class="sc menu" style="min-width:0;max-height:none"></div><div class="mo"></div></div><div class="pf"><button type="button" class="btn" data-c>Cancelar</button><button type="button" class="btn pri" data-ok>Aplicar</button></div>`,{align:'right'});if(!el)return;
  const sc=$('.sc',el),mo=$('.mo',el);
  const setPreset=p=>{preset=p;const t=new Date(today);const d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return x};
    ({hoje:()=>{ini=fim=t},ontem:()=>{ini=fim=d(1)},'7d':()=>{ini=d(6);fim=t},'30d':()=>{ini=d(29);fim=t},mes:()=>{ini=new Date(t.getFullYear(),t.getMonth(),1);fim=t},mesant:()=>{ini=new Date(t.getFullYear(),t.getMonth()-1,1);fim=new Date(t.getFullYear(),t.getMonth(),0)},'12m':()=>{ini=new Date(t.getFullYear()-1,t.getMonth(),t.getDate()+1);fim=t},custom:()=>{}}[p])();if(ini)view=new Date(fim.getFullYear(),fim.getMonth(),1);draw()};
  const draw=()=>{
    sc.innerHTML=PRESETS.map(([k,l])=>`<button type="button" class="mi" data-p="${k}"><span class="ck">${preset===k?ic('check',14,2):''}</span>${l}</button>`).join('');
    $$('[data-p]',sc).forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
    const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
    let g='';for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const t=+dt,inR=ini&&fim&&t>+ini&&t<+fim,edge=(ini&&t===+ini)||(fim&&t===+fim);
      g+=`<button type="button" class="day${dt.getMonth()!==m?' out':''}${t===+today?' today':''}${inR?' in':''}${edge?' edge':''}" data-d="${t}" ${t>+today?'disabled':''} aria-label="${dt.toLocaleDateString('pt-BR')}">${dt.getDate()}</button>`}
    mo.innerHTML=`<div class="mh"><button type="button" class="xbtn" style="margin:0" data-m="-1" aria-label="Mês anterior">${ic('chevl',16)}</button>${view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}<button type="button" class="xbtn" style="margin:0" data-m="1" aria-label="Próximo mês">${ic('chevr',16)}</button></div>
      <div class="grid">${['D','S','T','Q','Q','S','S'].map(d=>`<span class="wd">${d}</span>`).join('')}${g}</div>
      <label class="opt"><input type="checkbox" class="switch" ${cmp?'checked':''} data-cmp>Comparar com período anterior</label>
      <div class="mu sm" style="margin-top:6px">${ini?fmt.date(ini):'—'} – ${fim?fmt.date(fim):'—'}</div>`;
    $$('[data-m]',mo).forEach(b=>b.onclick=()=>{view=new Date(y,m+ +b.dataset.m,1);draw()});
    $$('[data-d]',mo).forEach(b=>b.onclick=()=>{const d=new Date(+b.dataset.d);preset='custom';if(!ini||fim){ini=d;fim=null}else if(d<ini){fim=ini;ini=d}else fim=d;draw()});
    $('[data-cmp]',mo).onchange=e=>cmp=e.target.checked;
  };
  if(!ini)setPreset(preset);else draw();
  el.place();
  $('[data-c]',el).onclick=()=>closePop();
  $('[data-ok]',el).onclick=()=>{if(!ini||!fim){toast('Selecione o intervalo','Escolha a data inicial e a final.','warning');return}
    const lbl=preset==='custom'?`${fmt.date(ini)} – ${fmt.date(fim)}`:PRESETS.find(p=>p[0]===preset)[1];
    state.periodo={preset,rotulo:lbl,ini:+ini,fim:+fim,comparar:cmp};closePop();onApply()};
}

/* =========================================================================
   TABELA PADRÃO (DESIGN_SYSTEM §5 Tabela + §12.10)
   cols: [{key,label,type,num,fmt(v,row),cls(v,row),title}] · opts: {rows, toolbar, actions, onRow, expand(row)=>[...], batchActions, pageSizes}
   ========================================================================= */
function dataTable(host,cfg){
  const st={sort:cfg.sort||null,dir:cfg.dir||1,sel:new Set(),open:new Set(),q:'',page:0,size:cfg.pageSize||10};
  host.innerHTML=`<div class="card"><div class="tbar"></div><div class="tw"><table class="dt"><thead></thead><tbody></tbody></table></div><div class="pg"></div></div>`;
  const card=$('.card',host),tbar=$('.tbar',card),thead=$('thead',card),tbody=$('tbody',card),pg=$('.pg',card);
  const filtered=()=>{let r=cfg.rows.filter(x=>!st.q||cfg.searchKeys.some(k=>String(x[k]??'').toLowerCase().includes(st.q)));
    if(st.sort){const k=st.sort;r=[...r].sort((a,b)=>{const x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR'))*st.dir})}return r};
  function drawBar(){
    if(st.sel.size){tbar.className='tb batch';tbar.innerHTML=`<span><b style="font-weight:500">${st.sel.size}</b> selecionado${st.sel.size>1?'s':''}</span>${(cfg.batchActions||[]).map((a,i)=>`<button type="button" class="btn" data-b="${i}">${esc(a.label)}</button>`).join('')}<div class="spacer"></div><button type="button" class="link" data-unsel>Limpar seleção</button>`;
      $$('[data-b]',tbar).forEach(b=>b.onclick=()=>cfg.batchActions[b.dataset.b].onClick([...st.sel],()=>{st.sel.clear();draw()}));$('[data-unsel]',tbar).onclick=()=>{st.sel.clear();draw()};return}
    tbar.className='tb';tbar.innerHTML=`<label class="input">${ic('search',14)}<input placeholder="${esc(cfg.placeholder||'Filtrar…')}" value="${esc(st.q)}" aria-label="${esc(cfg.placeholder||'Filtrar')}"></label>${cfg.toolbar||''}`;
    const inp=$('input',tbar);inp.oninput=()=>{st.q=inp.value.toLowerCase();st.page=0;drawBody();drawFoot()};
    cfg.onToolbar&&cfg.onToolbar(tbar,api_);
  }
  function drawHead(){const all=filtered(),allSel=all.length&&all.every(r=>st.sel.has(r.id));
    thead.innerHTML=`<tr><th class="cb${cfg.expand?' exp':''}"><input type="checkbox" aria-label="Selecionar todos" ${allSel?'checked':''}></th>${cfg.cols.map(c=>`<th class="sortable${c.num?' n':''}${st.sort===c.key?' sorted':''}" data-k="${c.key}" aria-sort="${st.sort===c.key?(st.dir>0?'ascending':'descending'):'none'}" tabindex="0">${c.num?`<span class="so">${st.sort===c.key&&st.dir<0?'↓':'↑'}</span>`:''}${esc(c.label)}<small>${esc(c.type)}</small>${c.help?' '+help(c.help):''}${c.num?'':`<span class="so">${st.sort===c.key&&st.dir<0?'↓':'↑'}</span>`}</th>`).join('')}</tr>`;
    $('input',thead).onchange=e=>{all.forEach(r=>e.target.checked?st.sel.add(r.id):st.sel.delete(r.id));draw()};
    $$('th[data-k]',thead).forEach(th=>{const f=e=>{if(e.target.closest('.q'))return;const k=th.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=1}draw()};th.onclick=f;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f(e)}}});
  }
  function cell(c,r){const v=r[c.key],t=c.fmt?c.fmt(v,r):esc(v??'—');return `<td class="${c.num?'n ':''}${c.cls?c.cls(v,r):''}"${c.title?` title="${esc(v)}"`:''}>${t}</td>`}
  function drawBody(){const all=filtered(),rows=all.slice(st.page*st.size,(st.page+1)*st.size);
    if(!all.length){tbody.innerHTML=`<tr><td colspan="${cfg.cols.length+1}" style="max-width:none;height:auto;border-right:0">${emptyHTML(cfg.emptyTitle||'Nenhum registro encontrado','Ajuste a busca ou os filtros para ver resultados.',st.q?'Limpar busca':'','search')}</td></tr>`;const b=$('[data-empty-act]',tbody);if(b)b.onclick=()=>{st.q='';drawBar();draw()};return}
    tbody.innerHTML=rows.map(r=>`<tr data-id="${r.id}" class="${cfg.onRow?'clickable':''}"><td class="cb${cfg.expand?' exp':''}"><input type="checkbox" aria-label="Selecionar linha" ${st.sel.has(r.id)?'checked':''}>${cfg.expand?`<button type="button" class="exp-btn${st.open.has(r.id)?' open':''}" aria-label="Expandir linha" aria-expanded="${st.open.has(r.id)}">${ic('chevr',14)}</button>`:''}</td>${cfg.cols.map(c=>cell(c,r)).join('')}</tr>`+
      (cfg.expand&&st.open.has(r.id)?cfg.expand(r).map(ch=>`<tr class="child"><td class="cb exp"></td>${cfg.cols.map((c,i)=>{const h=cell(c,ch);return i===0?h.replace('<td class="','<td class="indent '):h}).join('')}</tr>`).join(''):'')).join('');
    $$('tr[data-id]',tbody).forEach(tr=>{const id=tr.dataset.id;
      $('input',tr).onclick=e=>e.stopPropagation();
      $('input',tr).onchange=e=>{e.target.checked?st.sel.add(id):st.sel.delete(id);drawBar();drawHead()};
      const ex=$('.exp-btn',tr);if(ex)ex.onclick=e=>{e.stopPropagation();st.open.has(id)?st.open.delete(id):st.open.add(id);drawBody()};
      if(cfg.onRow)tr.onclick=()=>cfg.onRow(cfg.rows.find(x=>x.id===id))});
  }
  function drawFoot(){const n=filtered().length,pages=Math.max(1,Math.ceil(n/st.size));st.page=Math.min(st.page,pages-1);
    pg.innerHTML=`<button type="button" class="nav" data-pv aria-label="Página anterior" ${st.page===0?'disabled':''}>‹</button><span>Página</span><span class="btn sm" style="cursor:default">${st.page+1}</span><span>de ${pages}</span><button type="button" class="nav" data-nx aria-label="Próxima página" ${st.page>=pages-1?'disabled':''}>›</button><button type="button" class="btn sm" data-sz aria-haspopup="menu">${st.size} linhas${chev}</button><span>${fmt.int(n)} registro${n===1?'':'s'}</span>${cfg.footerRight||''}`;
    $('[data-pv]',pg).onclick=()=>{st.page--;drawBody();drawFoot()};$('[data-nx]',pg).onclick=()=>{st.page++;drawBody();drawFoot()};
    $('[data-sz]',pg).onclick=e=>menu(e.currentTarget,[5,10,25,100].map(s=>({label:s+' linhas',checked:st.size===s,onClick:()=>{st.size=s;st.page=0;drawBody();drawFoot()}})));
    cfg.onFooter&&cfg.onFooter(pg);
  }
  function draw(){drawBar();drawHead();drawBody();drawFoot()}
  const api_={reset(){st.q='';st.sort=cfg.sort||null;st.dir=cfg.dir||1;st.sel.clear();st.open.clear();draw()},setSort(k,d){st.sort=k;st.dir=d;draw()},state:st,card};
  draw();return api_;
}

const kpiHTML=k=>{const good=k.delta==null?null:Math.sign(k.delta)*k.polaridade>0,arrow=k.delta>0?'↑':k.delta<0?'↓':'→';
  return `<div class="card kpi"><div class="h"><span class="mono">${esc(k.rotulo)}</span>${help(k.ajuda)}<button type="button" class="go" aria-label="Detalhar ${esc(k.rotulo)}" data-drill="${k.id}">›</button></div><div class="v">${fmt.by(k.valor,k.formato)}${k.delta!=null?`<span class="d ${good?'good':k.delta===0?'mu':'bad'}">${arrow} ${fmt.by(k.delta,k.delta_formato)}</span>`:''}</div></div>`};

function pageOverview(page){

  $('#refBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.innerHTML='<span class="spin"></span>Atualizar';const t=toast('Atualizando dados','Buscando as informações mais recentes…','processing');

  function loadKPIs(){load($('#kpis'),{endpoint:'vendas/resumo',params:qparams(),skeleton:SK.kpi().repeat(6),frame:h=>`<div class="card" style="grid-column:1/-1">${h}</div>`,
    render:d=>{$('#kpis').innerHTML=d.kpis.map(kpiHTML).join('');

      const bn=$('#banner');bn.innerHTML=d.estoque_atualizado_ha_h>4&&!sessionStorage.getItem('bi-banner')?`<div class="banner" role="status"><span style="color:var(--warning);display:grid">${ic('alert',16,2)}</span><span>Dados de estoque atualizados há mais de ${d.estoque_atualizado_ha_h-1} horas.</span><div class="spacer"></div><button type="button" class="btn sm" id="bnAct">Ver integração</button><button type="button" class="x" aria-label="Dispensar aviso">${ic('x',14)}</button></div>`:'';
      if(bn.firstChild){$('.x',bn).onclick=()=>{try{sessionStorage.setItem('bi-banner','1')}catch(e){}bn.innerHTML=''};$('#bnAct',bn).onclick=()=>go('logs')}}})}

  function loadChart(){const el=$('#mainChart');
    const head=(v,p)=>`<div class="ch-t">Faturamento por seção ${help('Faturamento mensal por seção do supermercado. A linha tracejada é a meta mensal.','i')}</div><div class="ch-v">${v}</div><div class="ch-p">${esc(p)}</div>`;
    el.innerHTML=head('<span class="skel" style="display:inline-block;width:160px;height:20px"></span>','Carregando…')+`<div class="plot" id="mcp"></div>`;
    load($('#mcp'),{endpoint:'vendas/faturamento-secao',params:qparams(),skeleton:SK.chart(),isEmpty:d=>!d.pontos.length,onError:()=>{$('.ch-v',el).textContent='—';$('.ch-p',el).textContent=''},onEmpty:d=>{$('.ch-v',el).textContent='—';$('.ch-p',el).textContent=`${d.periodo} · fuso ${d.fuso}`},
      empty:emptyHTML('Sem vendas no período','Nenhuma venda encontrada para os filtros selecionados.','Limpar filtros','chart'),
      render:d=>{const total=sum(d.pontos.flatMap(p=>p.valores));
        el.innerHTML=head(fmt.brl(total),`${d.periodo} · fuso ${d.fuso}`)+`<div class="plot" id="mcp"></div>`+legend(d.series.map(s=>[s,corSecao(s)]));
        mountChart($('#mcp'),w=>$('#mcp').innerHTML=barChart({labels:d.pontos.map(p=>p.rotulo),heads:d.pontos.map(p=>`${p.rotulo} ${p.ano}`),sub:d.fuso,stacked:true,
