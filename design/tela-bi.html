  function loadHealth(){
    const card=(el,lbl,dotCls,right,data,foot)=>{el.innerHTML=`<div class="hl"><span class="sd ${dotCls}"></span><span class="mono">${esc(lbl)}</span><span class="r">${right}</span></div>${data}<div class="mu sm">${esc(foot)}</div>`};
    $('#h1').innerHTML=$('#h2').innerHTML=`<div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:48px;margin:14px 0 4px"></div><div class="skel" style="height:10px;width:40%"></div>`;
    api.get('operacao/saude',qparams()).then(d=>{
      if(!d.cupons){card($('#h1'),'Cupons emitidos','off','—','<div class="mini"></div>','Sem dados nas últimas 24 horas');card($('#h2'),'Entregas de fornecedores','off','—','<div class="mini"></div>','Sem dados nas últimas 24 horas');return}
      card($('#h1'),'Cupons emitidos','',`${fmt.int(d.cupons.total)} cupons`,miniHTML(d.cupons.barras),'Últimas 24 horas');
      card($('#h2'),'Entregas de fornecedores',d.entregas.erro_pct>10?'er':'',`${fmt.pct(d.entregas.erro_pct)} atrasadas`,miniHTML(d.entregas.barras),'Verde = no prazo · Vermelho = atraso');
    }).catch(err=>{[$('#h1'),$('#h2')].forEach(el=>{el.innerHTML=errorHTML(err);$('[data-retry]',el).onclick=loadHealth})});
  }
  function loadTable(){const host=$('#tbl');
    load(host,{endpoint:'produtos/desempenho',params:qparams(),skeleton:`<div class="card"><div class="tb"><div class="skel" style="height:28px;flex:1"></div></div>${SK.rows(8)}</div>`,
      frame:h=>`<div class="card">${h}</div>`,isEmpty:d=>!d.linhas.length,empty:`<div class="card">${emptyHTML('Nenhum produto encontrado','Não há vendas de produtos para os filtros selecionados.','Limpar filtros','search')}</div>`,
      render:d=>{const rows=d.linhas.map(r=>{const v=r.vendido==null?null:(r.vendido/r.meta-1)*100;return {...r,variacao:v,situacao:v==null?null:v>=5?'Acima':v<-10?'Abaixo':'Na meta'}});
        let view='Tabela';
        const t=dataTable(host,{rows,searchKeys:['produto','secao','fornecedor'],placeholder:'Filtrar por produto, seção ou fornecedor…',
          cols:[{key:'produto',label:'produto',type:'text',title:true},{key:'secao',label:'seção',type:'text'},{key:'meta',label:'meta',type:'num',num:true,fmt:fmt.brl},{key:'vendido',label:'vendido',type:'num',num:true,fmt:fmt.brl},
            {key:'variacao',label:'variação',type:'%',num:true,fmt:v=>fmt.pct(v,true),cls:v=>v==null?'':v>=0?'good':v<-10?'bad':''},{key:'situacao',label:'situação',type:'enum',fmt:v=>v?`<span class="badge ${v==='Acima'?'ok':v==='Abaixo'?'er':''}">${v}</span>`:'—'}],
          expand:r=>r.lojas.map(l=>{const v=l.vendido==null?null:(l.vendido/l.meta-1)*100;return {produto:l.loja,secao:'',meta:l.meta,vendido:l.vendido,variacao:v,situacao:null}}),
          toolbar:`<button type="button" class="btn" data-sort aria-haspopup="menu">Ordenar${chev}</button><button type="button" class="btn" data-reset>Redefinir visão</button><button type="button" class="btn pri" data-exp aria-haspopup="menu">${ic('download',14)}Exportar${chev}</button>`,
          onToolbar:(tb,a)=>{
            $('[data-sort]',tb).onclick=e=>menu(e.currentTarget,[{group:'Ordenar por'},...[['produto','Produto'],['vendido','Vendido'],['variacao','Variação']].map(([k,l])=>({label:l,checked:a.state.sort===k,onClick:()=>a.setSort(k,k==='produto'?1:-1)}))]);

            $('[data-exp]',tb).onclick=e=>menu(e.currentTarget,[{label:'CSV',kbd:'.csv',onClick:exportFlow},{label:'Excel',kbd:'.xlsx',onClick:exportFlow},{label:'PDF',kbd:'em breve',disabled:true},'-',{label:'Agendar envio',icon:'cal',children:[{label:'Diário',onClick:()=>toast('Envio agendado','Relatório diário às 7h.')},{label:'Semanal',onClick:()=>toast('Envio agendado','Relatório toda segunda às 7h.')}]}],{align:'right'});
          },

          footerRight:`<div class="segmented" role="tablist"><button type="button" class="on" data-v="Tabela" role="tab" aria-selected="true">Tabela</button><button type="button" data-v="Gráfico" role="tab" aria-selected="false">Gráfico</button></div>`,
          onFooter:pg=>$$('[data-v]',pg).forEach(b=>b.onclick=()=>{view=b.dataset.v;showView()}),

          else{tw.hidden=false;alt?.remove()}};
      }});
  }
  loadAll();
}

      chartCard({title:'Mix de canais por mês',helpText:'Barras empilhadas mostram composição e total. Tracejado = meta mensal.',value:fmt.brl(sum(d.mix.series.flatMap(s=>s.valores))),period:'Últimos 6 meses',body:'',id:'c4',legendHTML:legend(d.mix.series.map(s=>[s.nome,COR_CANAL[s.nome]]))})+
      chartCard({title:'Variação vs. ano anterior',helpText:'Verde à direita = acima do ano anterior; vermelho à esquerda = abaixo.',value:fmt.pct(5.1,true),period:'Por seção · '+PER(),body:divergeHTML(d.variacao)})+
      chartCard({title:'Indicadores com tendência',helpText:'Sparkline sem eixos; a cor segue o significado do indicador.',value:'4 indicadores',period:'Últimas 14 semanas',body:`<div class="sk4" style="grid-template-columns:1fr 1fr">${d.spark.map(k=>{const good=Math.sign(k.delta)*k.polaridade>0,c=good?'var(--brand)':'var(--error)';return `<div><span class="mono">${esc(k.rotulo)}</span><div style="font-size:18px;font-weight:500;margin-top:6px">${fmt.by(k.valor,k.formato)} <span class="sm ${good?'good':'bad'}" style="font-weight:400">${k.delta>0?'↑':'↓'} ${k.formato==='pct'?fmt.pp(k.delta):fmt.pct(k.delta,true)}</span></div>${sparkHTML(k.serie,c)}</div>`}).join('')}</div>`})+`</div>`;
    mountChart($('#c1 .plot'),w=>$('#c1 .plot').innerHTML=lineChart({labels:d.diario.rotulos,series:[{name:'Atual',color:'var(--series-1)',values:d.diario.atual},{name:'Período anterior',color:'var(--series-1)',values:d.diario.anterior,dashed:true}],everyX:5})(w));
    mountChart($('#c2 .plot'),w=>$('#c2 .plot').innerHTML=lineChart({labels:d.canais.rotulos,stacked:true,series:d.canais.series.map(s=>({name:s.nome,color:COR_CANAL[s.nome],values:s.valores})),everyX:2})(w));
    mountChart($('#c3 .plot'),w=>$('#c3 .plot').innerHTML=barChart({labels:d.lojas.rotulos,series:[{name:'Realizado',color:'var(--series-1)',values:d.lojas.realizado},{name:'Meta',color:'var(--series-3)',values:d.lojas.meta},{name:'Ano anterior',color:'var(--series-2)',values:d.lojas.anterior}]})(w));
    mountChart($('#c4 .plot'),w=>$('#c4 .plot').innerHTML=barChart({labels:d.mix.rotulos,stacked:true,series:d.mix.series.map(s=>({name:s.nome,color:COR_CANAL[s.nome],values:s.valores})),ref:{value:d.mix.meta,label:'Meta '+fmt.brl(d.mix.meta)}})(w));
  },
  composicao(host,d){const tot=sum(d.participacao.map(x=>x[1]));
    host.innerHTML=`<div class="gg">`+
      chartCard({title:'Participação por seção',helpText:'Máximo de 5 fatias + “Outros”. Passe o mouse para destacar.',value:fmt.brl(tot),period:PER(),body:donutHTML(d.participacao,'FATURAMENTO')})+
      chartCard({title:'Mapa de árvore por seção',helpText:'Áreas proporcionais ao faturamento. Bom para muitas categorias.',value:fmt.brl(tot),period:PER(),body:treemapHTML(d.participacao)})+
      chartCard({title:'Ranking de produtos',helpText:'Ordem decrescente, máximo de 10 itens.',value:fmt.brl(sum(d.ranking.map(x=>x[1]))),period:'Top 10 · '+PER(),body:rankHTML(d.ranking)})+
      chartCard({title:'Curva ABC (Pareto)',helpText:'Barras = faturamento; linha = acumulado. Itens que somam até 80% são classe A.',value:'7 itens classe A',period:PER(),body:'',id:'c5',legendHTML:legend([['Classe A','var(--series-1)'],['Demais','var(--series-3)'],['% acumulado','var(--series-2)']])})+`</div>`;
    mountChart($('#c5 .plot'),w=>$('#c5 .plot').innerHTML=paretoChart(d.pareto)(w));
  },
  relacao(host,d){
    host.innerHTML=`<div class="gg">`+
      chartCard({title:'Margem × giro de estoque',helpText:'Tamanho da bolha = faturamento. Linhas tracejadas = medianas.',value:'7 seções',period:PER(),body:'',id:'c6',legendHTML:legend(d.bolhas.map(b=>[b[0],corSecao(b[0])]))})+
      chartCard({title:'Fluxo de clientes por dia e hora',helpText:'Escala sequencial de 5 passos; ideal para escalar equipes e caixas.',value:fmt.int(Math.max(...d.fluxo.valores.flat()))+' no pico',period:'Média das últimas 8 semanas',body:heatHTML(d.fluxo)})+`</div>`;
    mountChart($('#c6 .plot'),w=>$('#c6 .plot').innerHTML=bubbleChart(d.bolhas)(w));
  },
  metas(host,d){const p=d.meta_mensal.realizado/d.meta_mensal.meta;
    host.innerHTML=`<div class="gg">`+
      chartCard({title:'Faturamento por estado',helpText:'Cada estado ocupa um quadrado de mesmo tamanho; cor = faturamento (5 passos).',value:fmt.brl(sum(Object.values(d.uf).map(v=>v.faturamento))),period:PER(),body:tileHTML(d.uf)})+
      chartCard({title:'Metas do mês',helpText:'Verde ≥ 100% · âmbar 80–99% · vermelho < 80%. Traço = meta.',value:fmt.brl(d.meta_mensal.realizado),period:'Meta '+fmt.brl(d.meta_mensal.meta),body:`<div style="display:flex;gap:24px;align-items:center"><div>${gaugeHTML(p)}</div><div style="flex:1;min-width:0">${bulletHTML(d.metas)}</div></div>`})+`</div>`;
  },
  processo(host,d){
    host.innerHTML=`<div class="gg">`+
      chartCard({title:'Funil do e-commerce',helpText:'Largura proporcional ao volume; ao lado, a conversão da etapa anterior.',value:fmt.pct(d.funil[4][1]/d.funil[0][1]*100)+' de conversão',period:'Jornada de compra · '+PER(),body:funnelHTML(d.funil)})+
      chartCard({title:'Do faturamento à margem',helpText:'Cascata: barras azuis = totais; vermelhas = reduções.',value:fmt.brl(sum(d.cascata.slice(0,-1).map(s=>s[1]))),period:'Margem do período',body:'',id:'c7'})+
      chartCard({title:'Linha do tempo de campanhas',helpText:'Cada barra é um período; a cor indica o tipo. “Hoje” marca a data atual.',value:d.campanhas.length+' campanhas',period:'Calendário comercial 2026',body:'',id:'c8',span:1,legendHTML:legend(Object.entries(COR_CAMPANHA))})+`</div>`;
    mountChart($('#c7 .plot'),w=>$('#c7 .plot').innerHTML=waterfallChart(d.cascata)(w));
    mountChart($('#c8 .plot'),w=>$('#c8 .plot').innerHTML=timelineChart(d.campanhas,d.hoje)(w));
  }
};

function pageAlerts(page){

    render:d=>{const NV={erro:['Crítico','er'],aviso:['Atenção','wn'],info:['Info','']};

        cols:[{key:'nivel',label:'nível',type:'enum',fmt:v=>`<span class="badge ${NV[v][1]}">${NV[v][0]}</span>`},{key:'titulo',label:'alerta',type:'text',title:true,fmt:(v,r)=>`<span style="${r.lido?'':'font-weight:500'}">${esc(v)}</span>`},{key:'tipo',label:'tipo',type:'text'},{key:'loja',label:'loja',type:'text'},{key:'quando',label:'quando',type:'timestamp',num:true,fmt:v=>fmt.ago(v)}],
        batchActions:[{label:'Marcar como lido',onClick:(ids,clear)=>{ids.forEach(id=>d.itens.find(x=>x.id===id).lido=true);clear();toast('Alertas atualizados',`${ids.length} marcado(s) como lido.`)}},{label:'Arquivar',onClick:(ids,clear)=>modal({title:'Arquivar alertas',body:`Arquivar ${ids.length} alerta(s)? Eles saem desta lista, mas ficam no histórico.`,actions:[{label:'Cancelar'},{label:'Arquivar',kind:'pri',onClick:m=>{m.close();clear();toast('Alertas arquivados','Disponíveis no histórico.')}}]})}]});
    }});

function pageSettings(page,sub){
  const tabs=[['geral','Geral'],['notificacoes','Notificações'],['aparencia','Aparência']],tab=tabs.find(t=>t[0]===sub)?sub:'geral';
  page.innerHTML=`<nav class="bc" aria-label="Trilha"><a href="#/visao-geral">Início</a><span class="sep">/</span><a href="#/configuracoes">Configurações</a><span class="sep">/</span><b>${tabs.find(t=>t[0]===tab)[1]}</b></nav>`+
    pageHeader('Configurações','Preferências da loja e da sua conta','','',true)+`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" aria-selected="${k===tab}" class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div id="cf"></div>`;
  $$('[data-t]',page).forEach(b=>b.onclick=()=>go('configuracoes/'+b.dataset.t));
  const cf=$('#cf'),s=state.sessao;
  const footer=`<div class="row" style="justify-content:flex-end;max-width:640px;border-top:1px solid var(--border);padding-top:16px;margin-top:8px"><button type="button" class="btn" data-cancel>Cancelar</button><button type="button" class="btn pri" data-save>Salvar alterações</button></div>`;
  if(tab==='geral'){cf.innerHTML=`<div class="card pad" style="max-width:640px">
    <div class="fgroup"><label for="f1">Nome da loja</label><input class="field" id="f1" value="${esc(s.loja)}"><span class="help">Aparece na topbar e nos relatórios.</span></div>
    <div class="fgroup"><span class="flabel" id="lr">Região</span><button type="button" class="btn select" id="f2" aria-labelledby="lr" aria-haspopup="menu"><span>Capital</span>${chev}</button></div>
    <div class="fgroup"><label for="f3">Meta mensal de faturamento</label><input class="field" id="f3" value="R$ 4.123.000,00" inputmode="decimal"><span class="help">Usada na linha de meta dos gráficos.</span></div>
    <div class="fgroup"><label for="f4">Observações</label><textarea class="field" id="f4" placeholder="Informações para a equipe da loja…"></textarea></div>
    <div class="fgroup"><span class="flabel">Canal padrão</span><label class="check"><input type="radio" name="cn" checked>Loja física</label><label class="check"><input type="radio" name="cn">E-commerce</label></div>
    </div>${footer}
    <h2>Zona de perigo</h2><div class="card pad" style="max-width:640px;display:flex;align-items:center;gap:16px"><div><div style="font-weight:500">Excluir visões salvas</div><div class="mu sm">Remove todas as visões salvas desta loja. Não pode ser desfeito.</div></div><div class="spacer"></div><button type="button" class="btn dan" id="delV">Excluir visões</button></div>`;
    $('#f2').onclick=e=>{const b=e.currentTarget;menu(b,s.regioes.slice(1).map(r=>({label:r,checked:$('span',b).textContent===r,onClick:()=>$('span',b).textContent=r})))};
    $('#delV').onclick=()=>{const d=modal({title:'Excluir visões salvas',confirmText:s.loja,body:`<p style="margin:0 0 12px">Esta ação não pode ser desfeita. Digite <b style="color:var(--text);font-weight:500">${esc(s.loja)}</b> para confirmar.</p><input class="field" data-confirm autofocus aria-label="Nome da loja para confirmar">`,
      actions:[{label:'Cancelar'},{label:'Excluir',kind:'dan',onClick:async(d,b)=>{d.loading(b,true);await sleep(1000);d.locked=false;d.close();toast('Visões excluídas','Todas as visões salvas desta loja foram removidas.')}}]})};
  }
  if(tab==='notificacoes'){cf.innerHTML=`<div class="card pad" style="max-width:640px">${[['Ruptura de estoque','Avisar quando um item ficar sem estoque.',1],['Entregas atrasadas','Avisar quando uma entrega passar de 2 horas de atraso.',1],['Meta atingida','Avisar quando uma seção atingir a meta.',0],['Resumo diário por e-mail','Enviado às 7h com os números do dia anterior.',0]].map(([t,dsc,on],i)=>`<label class="check" style="align-items:flex-start;justify-content:space-between;padding:12px 0;${i?'border-top:1px solid var(--border)':''};display:flex"><span><span style="display:block;font-weight:500">${t}</span><span class="mu sm">${dsc}</span></span><input type="checkbox" class="switch" ${on?'checked':''} style="margin-top:2px"></label>`).join('')}
    <div class="fgroup" style="margin-top:12px"><label for="em">E-mail para alertas</label><input class="field invalid" id="em" value="joana@rede" aria-invalid="true" aria-describedby="eme"><span class="err" id="eme">Informe um e-mail válido, como nome@empresa.com.br.</span></div></div>${footer}`;
    $('#em').oninput=e=>{const ok=/^\S+@\S+\.\S+$/.test(e.target.value);e.target.classList.toggle('invalid',!ok);e.target.setAttribute('aria-invalid',!ok);$('#eme').hidden=ok};
  }
  if(tab==='aparencia'){const cur=document.documentElement.dataset.theme||'system';cf.innerHTML=`<div class="card pad" style="max-width:640px"><div class="fgroup"><span class="flabel">Tema</span>${[['system','Sistema','Segue o tema do sistema operacional.'],['light','Claro',''],['dark','Escuro','']].map(([k,l,h])=>`<label class="check"><input type="radio" name="th" value="${k}" ${cur===k?'checked':''}>${l}${h?` <span class="mu sm">· ${h}</span>`:''}</label>`).join('')}<span class="help">A escolha manual prevalece sobre o sistema e fica salva neste navegador.</span></div></div>`;
    $$('[name=th]',cf).forEach(r=>r.onchange=()=>{setTheme(r.value);toast('Tema aplicado',r.parentElement.textContent.split('·')[0].trim()+'.','info')});
  }
  const sv=$('[data-save]',cf);if(sv)sv.onclick=async e=>{const b=e.currentTarget;if($('.field.invalid',cf)){toast('Revise os campos','Há um campo com erro.','warning');$('.field.invalid',cf).focus();return}b.disabled=true;b.innerHTML='<span class="spin"></span>Salvar alterações';await sleep(900);b.disabled=false;b.textContent='Salvar alterações';toast('Configurações salvas','As alterações já valem para esta loja.')};
  const cc=$('[data-cancel]',cf);if(cc)cc.onclick=()=>route();
}

</script>
<script>
/* =========================================================================
   DESIGN SYSTEM — documentação viva (somente em desenvolvimento; não levar ao produto)
   ========================================================================= */
const DS_PAGES=[
  ['inicio','Como usar esta referência','FUNDAMENTOS'],['principios','Princípios e regras','FUNDAMENTOS'],['cores','Cores','FUNDAMENTOS'],['tipografia','Tipografia','FUNDAMENTOS'],['espaco','Espaço, raios e ícones','FUNDAMENTOS'],['motion','Movimento','FUNDAMENTOS'],['layout','Estrutura da página','FUNDAMENTOS'],['pagina','Como montar uma página','FUNDAMENTOS'],
  ['botoes','Botões e badges','COMPONENTES'],['formularios','Formulários e inputs','COMPONENTES'],['navegacao','Navegação','COMPONENTES'],['filtros','Filtros e período','COMPONENTES'],['sobreposicoes','Tooltip, modal, drawer e toast','COMPONENTES'],['kpi','KPI e indicadores','COMPONENTES'],['tabela','Tabela','COMPONENTES'],['estados','Carregamento, vazio e erro','COMPONENTES'],
  ['graficos','Gráficos','DADOS'],['dados','Dados e backend','DADOS']];
const spec=(rows,head=['Propriedade','Valor'])=>`<div class="card"><table class="doc-table"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const demo=(html,cap,col)=>`<div class="card"><div class="demo${col?' col':''}">${html}</div>${cap?`<div class="demo-cap">${cap}</div>`:''}</div>`;
const dodont=(dos,donts)=>`<div class="dd"><div class="card"><span class="badge ok">Fazer</span><ul>${dos.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><span class="badge er">Evitar</span><ul>${donts.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
const c=s=>`<code>${s}</code>`;

function pageDS(page,sub){
  const cur=DS_PAGES.find(p=>p[0]===sub)?sub:'inicio';
  let g='';$('#subnav').innerHTML=`<div class="title">Design System</div>`+DS_PAGES.map(([k,l,grp])=>{const h=grp!==g?`<span class="mono">${grp}</span>`:'';g=grp;return h+`<a href="#/ds/${k}" class="${k===cur?'on':''}" ${k===cur?'aria-current="page"':''}>${l}</a>`}).join('');
  const p=DS[cur];page.innerHTML=pageHeader(DS_PAGES.find(x=>x[0]===cur)[1],p.sub,'',p.badge||'')+p.html();p.wire&&p.wire(page);
}

const DS={
inicio:{sub:'O que este arquivo é, o que não é, e como o agente deve usá-lo',badge:' <span class="badge">v3.1</span>',html:()=>`
  <div class="kg">${[['FORMA','Esta referência define tokens, layout, componentes e comportamento. É a fonte de verdade visual.'],['CONTEÚDO','Números, nomes e listas vêm sempre do backend. Os valores daqui são de demonstração e não vão para o produto.'],['DIVERGÊNCIA','Se o documento e esta tela discordarem, vale a tela. Nova necessidade: combinar componentes existentes antes de criar um novo.']].map(([t,d])=>`<div class="card" style="padding:14px 16px"><span class="mono">${t}</span><div style="margin-top:8px;font-size:13px">${d}</div></div>`).join('')}</div>
  <h2>Mapa da referência</h2>
  ${spec([[`<a href="#/visao-geral" class="good">Visão geral</a>`,'Tela aprovada: KPIs, gráfico empilhado, indicadores de saúde, tabela com drawer, modal e toasts.'],[`<a href="#/dashboards" class="good">Dashboards</a>`,'Todos os tipos de gráfico em uso real, organizados em abas.'],[`<a href="#/alertas" class="good">Alertas</a>`,'Tabela com seleção em lote e badges de nível.'],[`<a href="#/configuracoes" class="good">Configurações</a>`,'Formulários, switches, radio, breadcrumb, abas, confirmação digitada.'],['Design System','Esta seção: regras, especificações e exemplos vivos de cada componente.']],['Página','O que demonstra'])}
  <h2>Arquivos</h2>
  ${spec([[c('design/tela-bi.html'),'Esta referência navegável (fonte de verdade).'],[c('design/DESIGN_SYSTEM.md'),'Regras escritas, com todas as medidas.'],[c('design/design-tokens.md'),'Tokens em CSS e JSON, prontos para copiar.'],[c('CLAUDE.md'),'Instruções para o agente de desenvolvimento.']],['Arquivo','Papel'])}
  <h2>Legenda de status</h2>
  ${spec([['<span class="badge ok">Tela</span>','Implementado e aprovado na tela.'],['<span class="badge">Especificado</span>','Derivado dos tokens, implementado nesta referência, pode ser usado.'],['<span class="badge wn">Pendente</span>','Precisa de decisão antes de ser usado (ver DESIGN_SYSTEM §13).']],['Status','Significado'])}`},

principios:{sub:'Seis princípios e as regras obrigatórias de consistência',html:()=>`
  ${spec([['1. Borda antes de sombra','Hierarquia por contorno de 1 px. Sombra só em tooltip, popover e toast.'],['2. Um acento','Verde é marca e ação primária. Vermelho, laranja e azul só têm função semântica (exceto como cor de série de dados).'],['3. Rótulo técnico, valor humano','Rótulo em mono caixa-alta pequeno; valor em sans maior.'],['4. Nada pula','Sidebar, modal, tooltip e popover nunca deslocam o layout.'],['5. Contexto sob demanda','Explicações ficam em tooltips (? e i), nunca no corpo da página.'],['6. Tudo por token','Nenhuma cor, raio ou espaçamento fora dos tokens.']],['Princípio','Regra'])}
  <h2>Regras de consistência (obrigatórias)</h2>
  <div class="card pad prose" style="max-width:none"><ol style="margin:0">
  <li>Raio por papel: <b>6</b> controles · <b>8</b> superfícies · <b>total</b> pills e badges · <b>4</b> só em gráfico.</li>
  <li>Card = borda 1 px, sem sombra.</li>
  <li>Rótulo de KPI e de seção sempre em mono caixa-alta; valor sempre em sans.</li>
  <li>Um botão primário por área; destrutivo só em confirmações, sempre à direita.</li>
  <li>Verde = marca e positivo. Nunca verde para algo neutro ou negativo (a série Mercearia é a única exceção categórica).</li>
  <li>Mesma categoria = mesma cor em todos os gráficos (mapa fixo em <a class="good" href="#/ds/graficos">Gráficos</a>).</li>
  <li>Todo gráfico segue a anatomia; todo KPI tem <code>?</code>.</li>
  <li>Toda tabela: cabeçalho com tipo, linhas de 35 px, numéricos à direita, rodapé padrão.</li>
  <li>Todo modal em três faixas; todo toast com a mesma estrutura.</li>
  <li>Cores, espaçamentos e raios só via tokens.</li>
  <li>Todo bloco que busca dados tem os três estados: carregando, vazio e erro.</li>
  <li>Nenhum dado fixo no código: tudo vem do backend (ver <a class="good" href="#/ds/dados">Dados e backend</a>).</li>
  <li>Nova necessidade: combinar componentes existentes; só depois criar, documentando antes de usar.</li></ol></div>`},

cores:{sub:'Tokens de cor nos dois temas. Alterne o tema na topbar para comparar.',html:()=>{
  const sw=(n,u)=>`<div class="card swatch"><i style="background:var(--${n})"></i><div><b>${n}</b><span data-hex="${n}"></span><div class="mu sm">${u}</div></div></div>`;
  return `<h2 style="margin-top:0">Superfície e texto</h2><div class="swatches">${[['bg','Fundo da página, topbar e sidebar'],['surface','Cards, modal, tooltip, toast'],['hover','Hover, item ativo, segmento ativo, trilho'],['border','Todas as bordas e divisores'],['text','Texto principal e valores'],['muted','Rótulos, descrições, eixos'],['overlay','Fundo do modal e drawer (+ blur 3 px)']].map(x=>sw(...x)).join('')}</div>

  <h2>Regras</h2>${dodont(['Texto verde ou âmbar usa '+c('brand-text')+' / '+c('warning-text')+' (contraste AA no tema claro).','Gráficos, pontos e bordas usam '+c('brand')+' / '+c('warning')+'.','Tema segue o sistema; escolha manual prevalece e fica salva.'],['Cor fixa no código (hex fora dos tokens).',c('brand')+' como cor de texto no tema claro (contraste 2:1).','Usar cor semântica para categoria, ou cor de categoria para estado.'])}`},
  wire:p=>{const paint=()=>$$('[data-hex]',p).forEach(e=>{const v=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.hex).trim();e.textContent=v.startsWith('var')?getComputedStyle(e.parentElement.previousElementSibling).backgroundColor:v.toUpperCase()});paint();new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}},

dados:{sub:'Contrato entre a interface e o backend. Nada de dado fixo no código.',html:()=>`
  <div class="card pad"><div class="row"><div><div style="font-weight:500">Simular resposta da API</div><div class="mu sm">Muda a resposta de todos os endpoints desta referência. Navegue até a Visão geral para ver cada estado.</div></div><div class="spacer"></div><div class="segmented" id="apim">${['dados','vazio','erro','lento'].map(m=>`<button class="${api.mode===m?'on':''}" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div></div>
  <h2>Regras para o agente</h2>
  <div class="card pad prose" style="max-width:none"><ol style="margin:0">
  <li><b>Nenhum valor de negócio no front.</b> Números, nomes de lojas, produtos, metas, períodos e usuários vêm da API. Os dados desta referência são de demonstração.</li>
  <li><b>Backend envia valores crus</b> (número, ISO 8601, enum); o front formata em pt-BR (${c('R$ 1.234,56')}, ${c('26,6%')}, ${c('dd/mm/aaaa')}).</li>
  <li><b>Ausente = ${c('null')}</b> → a UI mostra —, nunca 0.</li>
  <li><b>Cores não vêm do backend.</b> O front mapeia a categoria (ex.: seção) para a cor fixa.</li>
  <li><b>KPI traz ${c('polaridade')}</b> (+1 maior é melhor, −1 menor é melhor); a cor do delta é calculada a partir dela.</li>
  <li><b>Cada bloco carrega sozinho</b> com skeleton, vazio e erro com “Tentar novamente”. Um bloco com erro não derruba a página.</li>
  <li><b>Datas em UTC</b>; exibição no fuso da loja (padrão ${c('America/Sao_Paulo')}), informado no tooltip.</li>
  <li><b>Filtros e período globais</b> viram parâmetros de todas as chamadas da página.</li></ol></div>

}

/* =========================================================================
   INICIALIZAÇÃO — sessão vem do backend antes do primeiro render
   ========================================================================= */
(async function init(){
  renderSidebar('');
  $('#topbar').innerHTML=`<span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" style="fill:currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><div class="skel" style="width:280px;height:14px"></div>`;
  try{const m=api.mode;api.mode='dados';state.sessao=await api.get('sessao');api.mode=m}catch(e){}
  renderTopbar();route();
})();
</script>
